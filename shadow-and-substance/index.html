}

/* ================= DETAIL SHEET ================= */
const overlap=(a1,a2,b1,b2)=>a1>=b2&&b1>=a2;
function contemporaries(y1,y2,self){const out=[];
 KINGS.forEach(k=>{if(k[0]!==self&&overlap(y1,y2,k[2],k[3]))out.push({id:k[0],n:nameOf(k[0],k[1]),c:k[4],kind:"king"})});
 PROPHETS.forEach(p=>{if(p[0]!==self&&overlap(y1,y2,p[2],p[3]))out.push({id:p[0],n:nameOf(p[0],p[1]),c:"pro",kind:"prophet"})});
 PRIESTS.forEach(p=>{if(p[0]!==self&&overlap(y1,y2,p[2],p[3]))out.push({id:p[0],n:nameOf(p[0],p[1]),c:"pri",kind:"priest"})});
 return out}
const lnks=list=>list.map(c=>`<span class="lnk ${c.c}" data-go="${c.kind}:${c.id}">${esc(c.n)}</span>`).join("");
let lastOpen=null;
function show(hd,bd){$("#shd").innerHTML=hd;$("#sbd").innerHTML=bd;$("#sheet").classList.add("on");$("#scrim").classList.add("on");$("#sheet").scrollTop=0;
 $("#sheet").querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>{const [k,id]=e.dataset.go.split(":");if(k==="type")openType(id);else if(k==="promise")openPromise(+id);else openPerson(id)})}
function closeSheet(){$("#sheet").classList.remove("on");$("#scrim").classList.remove("on");lastOpen=null}
$("#x").onclick=closeSheet;$("#scrim").onclick=closeSheet;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function track(fn,arg){lastOpen=[fn,arg]}
function openPerson(id){track(openPerson,id);
 const p=OFFMAP[id],k=KMAP[id],pr=PMAP[id],q=QMAP[id],base=p||k||pr||q;if(!base)return;
 const src=k||pr||q||p,y1=src.y1,y2=src.y2,t=ot(id);
 const roles=[];if(p)roles.push(p.o);if(p&&p.o2)roles.push(p.o2);if(!p)roles.push(k?"king":pr?"prophet":"priest");
 let hd=`<div class="k">${roles.map(r=>`<span style="color:${OCOL[r]}">${esc(u(r))}</span>`).join(" · ")}${k?` · ${esc(u(ROWKEY[k.row]))}`:""}</div><h2>${Ti(base.name,teName(id))}</h2><div class="ref">${p?esc(P(p.when,t.when)):yr(y1,y2)}${k?`<span class="verdict" style="background:${VCOL[k.v]}">${esc(u(VKEY[k.v]))}</span>`:""}</div>`;
 let bd="";
 if(p){bd+=ee(p.earthly,t.earthly,p.eternal,t.eternal,p.limit,t.limit);
  if(p.also)bd+=`<div class="limit"><b style="color:var(--pri)">${u("note")}</b> ${T(p.also,t.also)}</div>`;
  bd+=`<h4>${uT("scripture")}</h4><div class="ref">${esc(RF(p.refs))}</div>`;
  const ts=typesFor(id);if(ts.length)bd+=`<h4>${uT("ntTypes")}</h4>`+ts.map(x=>`<span class="lnk typ" data-go="type:${x.id}">${esc(P(x.n,(TE.types[x.id]||[])[0]))}</span>`).join("");
 }else{const note=(k&&k.note)||(pr&&pr.note)||(q&&q.note)||"";bd+=`<div class="ee" style="grid-template-columns:1fr"><div class="earthly"><span class="k">${uT("earthly")}</span>${T(note,teNote(id))}</div></div>`}
 if(y1<1200){const c=contemporaries(y1,y2,id);if(c.length)bd+=`<h4>${uT("same")}</h4>`+lnks(c)}
 const prom=PROMISES.map((x,i)=>[x,i]).filter(([x])=>x.y<=y1+5&&x.y>=y2-5);
 if(prom.length)bd+=`<h4>${uT("promPeriod")}</h4>`+prom.map(([x,i])=>`<span class="lnk typ" data-go="promise:${i}">${esc(P(x.t,TE.prom[i][0]))} · ${esc(RF(x.r))}</span>`).join("");
 show(hd,bd)}
function openType(id){track(openType,id);
 const t=TYPEMAP[id],x=TE.types[id]||[];
 let hd=`<div class="k">${uT("typeOf")} · ${esc(P(t.c,TE.cat[t.c]))}</div><h2>${Ti(t.n,x[0])}</h2>`;
 let bd=ee(t.s,x[1],t.u,x[2])+`<div class="limit"><b>${u("stops")}</b> ${T(t.x,x[3])}</div><h4>${uT("ot")}</h4><div class="ref">${esc(RF(t.ot))}</div><h4>${uT("nt")}</h4><div class="ref">${esc(RF(t.nt))}</div>`;
 const ps=peopleForType(id);if(ps.length)bd+=`<h4>${uT("onTl")}</h4>`+ps.map(p=>`<span class="lnk ${p.o==="prophet"?"pro":p.o==="priest"?"pri":"jud"}" data-go="${p.o}:${p.id}">${esc(nameOf(p.id,p.name))}</span>`).join("");
 if(t.o.length)bd+=`<h4>${uT("officeOf")}</h4>`+t.o.map(o=>`<span class="pill" style="color:${OCOL[o]}">${esc(u(o))}</span>`).join("");
 show(hd,bd)}
function openPromise(i){track(openPromise,i);
 const p=PROMISES[i],t=TE.prom[i];
 const hd=`<div class="k" style="color:var(--eter)">${uT("eternalProm")} · ${esc(u(p.o))}</div><h2>${Ti(p.t,t[0])}</h2><div class="ref">${LANG==="te"?"సుమారు క్రీ.పూ. "+p.y:"c. "+p.y+" BC"} · ${esc(RF(p.r))}</div>`;
 let bd=`<div class="ee" style="grid-template-columns:1fr"><div class="eternal"><span class="k">${uT("promise")}</span>${T(p.d,t[1])}</div></div><h4>${uT("fulfilled")}</h4><div class="ref">${esc(RF(p.nt))}</div>`;
 const kings=KINGS.filter(k=>overlap(p.y+3,p.y-3,k[2],k[3]));
 if(kings.length)bd+=`<h4>${uT("whileKings")}</h4>`+lnks(kings.map(k=>({id:k[0],n:nameOf(k[0],k[1]),c:k[4],kind:"king"})));
 show(hd,bd)}
function openEvent(y){track(openEvent,y);
 const e=EVENTS.find(x=>x[0]===y);
 show(`<div class="k" style="color:var(--earth)">${uT("tEvent")}</div><h2>${Ti(e[1],TE.events[y])}</h2><div class="ref">${yr(y,y)} · ${esc(RF(e[2]))}</div>`,`<h4>${uT("atTime")}</h4>${lnks(contemporaries(y,y,""))}`)}
function openChrist(o){track(openChrist,o);
 const keys=o==="all"?["prophet","priest","king"]:[o];
 const hd=`<div class="k" style="color:var(--eter)">${uT("fulfil")}</div><h2>${o==="all"?Ti(U.christAll[0],U.christAll[1]):Ti(CHRIST[o].t,TE.christ[o].t)}</h2>`;
 const pk={prophet:"pointedP",priest:"pointedQ",king:"pointedK"};
 let bd=keys.map(k=>`<h4 style="color:${OCOL[k]}">${Ti(CHRIST[k].t,TE.christ[k].t)}</h4><div class="ee" style="grid-template-columns:1fr"><div class="eternal">${T(CHRIST[k].q,TE.christ[k].q)}<br><br>${T(CHRIST[k].p,TE.christ[k].p)}</div></div>`).join("");
 keys.forEach(k=>{bd+=`<h4>${uT(pk[k])}</h4>`+OFF.filter(p=>p.o===k||p.o2===k).map(p=>`<span class="lnk ${k==="prophet"?"pro":k==="priest"?"pri":"jud"}" data-go="${p.o}:${p.id}">${esc(nameOf(p.id,p.name))}</span>`).join("")});
 const ts=TYPES.filter(t=>keys.some(k=>t.o.includes(k)));
 if(ts.length)bd+=`<h4>${uT("related")}</h4>`+ts.map(t=>`<span class="lnk typ" data-go="type:${t.id}">${esc(P(t.n,(TE.types[t.id]||[])[0]))}</span>`).join("");
 show(hd,bd)}

/* ================= ROUTING, LENS, LANGUAGE ================= */
const VIEWS=["offices","timeline","types","contrast","metro","seed","restore","gather"];
let CUR="offices";
function go(v){if(!VIEWS.includes(v))v="offices";CUR=v;
 document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
 document.querySelectorAll(".tabrow button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 if(v==="timeline")renderTimeline();
 const tb=document.querySelector('.tabrow button[data-v="'+v+'"]'),tr=document.querySelector(".tabrow");
 if(tb&&tr){const l=tb.offsetLeft-tr.offsetLeft;if(l<tr.scrollLeft||l+tb.offsetWidth>tr.scrollLeft+tr.clientWidth)tr.scrollLeft=l-20}}
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
let LENSV="both";
function setLens(l){LENSV=l;document.body.classList.remove("l-earthly","l-both","l-eternal");document.body.classList.add("l-"+l);
 document.querySelectorAll(".lens button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));try{localStorage.setItem("ss-lens",l)}catch(e){}}
function renderAll(){renderStatic();renderDiagram();renderOffices();renderTypes();renderContrast();renderMetro();renderSeed();renderRestore();renderGather();setLens(LENSV);go(CUR)}
function setLang(l){LANG=l;document.body.classList.remove("lang-en","lang-both","lang-te");document.body.classList.add("lang-"+l);try{localStorage.setItem("ss-lang",l)}catch(e){}
 renderAll();if(CUR==="timeline")renderTimeline();if(lastOpen&&$("#sheet").classList.contains("on"))lastOpen[0](lastOpen[1])}
document.querySelectorAll(".langsw button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
try{LENSV=localStorage.getItem("ss-lens")||"both";LANG=localStorage.getItem("ss-lang")||"both"}catch(e){}
CUR=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"offices";
setLang(LANG);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(CUR==="timeline")renderTimeline();renderSeed()});

</script>
</body>
</html>
