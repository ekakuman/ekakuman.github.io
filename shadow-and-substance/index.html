<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow &amp; Substance — Prophets, Priests &amp; Kings Fulfilled in Christ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe3;--card:#fffcf6;--ink:#2a2118;--muted:#6e604f;--line:#e3d8c4;--soft:#efe6d5;
  --good:#2e7a57;--evil:#a3322c;--mixed:#b9831a;--none:#8a8174;
  --isr:#365d8c;--jud:#8b5a28;--uni:#5f6b3a;--pro:#5a4796;--pri:#2d6f73;--ev:#3d3328;
  --earth:#8a6f57;--earthbg:#f1e8dc;--eter:#9a7414;--eterbg:#fbf3dc;--christ:#2a2118;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Telugu",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,.serif{font-family:"Cormorant Garamond","Noto Sans Telugu",Georgia,serif}
svg{font-family:Inter,"Noto Sans Telugu",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:18px 16px 4px;max-width:1150px;margin:0 auto}
header h1{font-size:31px;line-height:1.05;margin:0 0 4px;font-weight:700}
header p{margin:0;color:var(--muted);font-size:13.5px;max-width:760px}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .in{max-width:1150px;margin:0 auto;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tabrow{display:flex;gap:4px;flex:1 1 420px}
.tabrow button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 6px;font-weight:600;font-size:13px;white-space:nowrap}
.tabrow button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.lens{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:0 0 auto}
.lens button{border:0;background:none;padding:7px 11px;font-size:12.5px;font-weight:600}
.lens button.on[data-l=earthly]{background:var(--earth);color:#fff}
.lens button.on[data-l=both]{background:var(--ink);color:#fff}
.lens button.on[data-l=eternal]{background:var(--eter);color:#fff}
main{max-width:1150px;margin:0 auto;padding:12px 12px 70px}
.view{display:none}.view.on{display:block}
.intro{font-size:13.5px;color:var(--muted);margin:2px 2px 12px;max-width:820px}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ref{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;border:1px solid var(--line);background:var(--soft);color:var(--muted);margin:0 4px 4px 0}
.pill.t{background:var(--eterbg);border-color:#ead9a6;color:var(--eter);cursor:pointer}
/* earthly/eternal blocks */
.ee{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ee>div{border-radius:10px;padding:8px 10px;font-size:13px;transition:opacity .25s,filter .25s}
.ee .earthly{background:var(--earthbg);border-left:3px solid var(--earth)}
.ee .eternal{background:var(--eterbg);border-left:3px solid var(--eter)}
.ee .k{display:block;margin-bottom:2px}
.ee .earthly .k{color:var(--earth)}.ee .eternal .k{color:var(--eter)}
body.l-earthly .eternal,body.l-earthly .dim-earthly{opacity:.28;filter:saturate(.3)}
body.l-eternal .earthly,body.l-eternal .dim-eternal{opacity:.28;filter:saturate(.3)}
.limit{font-size:12.5px;color:var(--muted);margin-top:6px}
.limit b{color:var(--evil);font-weight:600}
@media(max-width:620px){.ee{grid-template-columns:1fr}}
/* offices */
.diagram{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:14px}
.diagram svg{width:100%;height:auto;display:block}
.diagram .node{cursor:pointer}
.diagram .node:hover rect,.diagram .node:hover circle{stroke-width:2.5}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.col h2{font-size:25px;margin:0;line-height:1.1}
.colhead{border-radius:14px;padding:12px 14px;color:#fff;margin-bottom:10px;cursor:pointer}
.colhead p{margin:4px 0 0;font-size:13px;opacity:.92}
.colhead .q{font-family:"Cormorant Garamond","Noto Sans Telugu",serif;font-size:17px;font-style:italic;margin-top:6px;line-height:1.25}
.colhead.prophet{background:var(--pro)}.colhead.priest{background:var(--pri)}.colhead.king{background:var(--jud)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;cursor:pointer;position:relative}
.card:hover{border-color:#cdbb9c}
.card h3{font-size:20px;margin:0;line-height:1.1}
.card .meta{font-size:12px;color:var(--muted)}
.card .typeflag{position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:700;color:var(--eter);background:var(--eterbg);border:1px solid #ead9a6;border-radius:999px;padding:0 7px}
.card .ctr{position:absolute;top:9px;right:10px;font-size:10.5px;font-weight:700;color:var(--evil);background:#f8e7e4;border:1px solid #eac7c2;border-radius:999px;padding:0 7px}
.colfilter{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.christbar{background:var(--christ);color:#fbf3dc;border-radius:14px;padding:14px 16px;margin:6px 0 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.christbar h3{font-size:21px;margin:0 0 3px;color:#f1d98a}
.christbar p{margin:0;font-size:13px;opacity:.9}
@media(max-width:760px){.christbar{grid-template-columns:1fr}}
/* timeline */
.toolbar{display:flex;align-items:center;gap:8px;margin:0 2px 8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.toolbar button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:2px 2px 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.tlwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.tl{position:relative}
.trow{position:relative;border-top:1px solid var(--soft);transition:opacity .25s,filter .25s}
.trow .lab{position:sticky;left:0;z-index:5;width:104px;height:100%;position:absolute;background:linear-gradient(90deg,var(--card) 80%,rgba(255,252,246,0));font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;line-height:1.2}
.trow.eternalrow{background:linear-gradient(180deg,#fdf7e6,#fbf1d4)}
.trow.eternalrow .lab{background:linear-gradient(90deg,#fcf4dd 80%,rgba(252,244,221,0));color:var(--eter)}
.it{position:absolute;height:22px;font-size:11.5px;white-space:nowrap;cursor:pointer;display:flex;align-items:center}
.it .bar{position:absolute;left:0;top:3px;height:16px;border-radius:4px}
.it .tx{position:relative;padding:0 5px;font-weight:600;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.25)}
.it.out .tx{color:var(--ink);text-shadow:none}
.it.pt .dot{width:11px;height:11px;transform:rotate(45deg);border-radius:2px;margin:0 4px 0 -5px;flex:0 0 auto}
.it.pt .tx{color:var(--ink);text-shadow:none;padding-left:2px}
.it .star{position:absolute;top:-4px;left:-3px;width:9px;height:9px;border-radius:50%;background:#f1c94a;border:1.5px solid var(--eter);z-index:2}
.axis{position:sticky;top:0;z-index:6;height:24px;background:var(--card);border-bottom:1px solid var(--line)}
.axis span{position:absolute;top:4px;font-size:10.5px;color:var(--muted);transform:translateX(-50%)}
.gl{position:absolute;top:24px;bottom:0;width:1px;background:var(--soft);pointer-events:none}
.endcap{font-family:"Cormorant Garamond","Noto Sans Telugu",serif;position:absolute;top:24px;bottom:0;background:linear-gradient(90deg,rgba(42,33,24,0),rgba(42,33,24,.92) 30%);color:#f1d98a;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-family:"Cormorant Garamond",serif;font-size:19px;font-weight:700;text-align:right;line-height:1.15;cursor:pointer}
body.l-earthly .trow.eternalrow{opacity:.3;filter:saturate(.2)}
body.l-eternal .trow.earthrow{opacity:.3;filter:saturate(.2)}
.tlnote{font-size:12.5px;color:var(--muted);margin:8px 2px}
/* types */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.tcard h3{font-size:20px}
.tcard .refs{font-size:12px;color:var(--muted);margin-top:2px}
/* contrast */
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.chartbox h2{font-size:22px;margin:0 0 2px}
.chartbox svg{width:100%;height:auto;display:block}
.ctable{display:grid;gap:8px}
.crow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.crow h3{font-size:20px;margin:0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(30,22,14,.38);z-index:40;display:none}
.sheet{position:fixed;z-index:41;background:var(--card);display:none;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media(min-width:821px){.sheet{top:0;right:0;bottom:0;width:470px;border-left:1px solid var(--line)}}
@media(max-width:820px){.sheet{left:0;right:0;bottom:0;max-height:86vh;border-radius:18px 18px 0 0}}
.sheet.on,.scrim.on{display:block}
.sheet .hd{position:sticky;top:0;background:var(--card);padding:14px 16px 8px;border-bottom:1px solid var(--line);z-index:2}
.sheet .hd h2{margin:0;font-size:28px;line-height:1.05}
.sheet .x{position:absolute;right:12px;top:12px;border:1px solid var(--line);background:var(--soft);border-radius:999px;width:32px;height:32px;font-size:18px;line-height:1}
.sheet .bd{padding:10px 16px 30px}
.sheet .bd .ee{grid-template-columns:1fr}
.sheet h4{margin:14px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet .lnk{display:inline-block;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:2px 8px;margin:0 4px 5px 0;font-size:12.5px;cursor:pointer}
.sheet .lnk.pro{border-left:3px solid var(--pro)}.sheet .lnk.pri{border-left:3px solid var(--pri)}.sheet .lnk.isr{border-left:3px solid var(--isr)}.sheet .lnk.jud{border-left:3px solid var(--jud)}.sheet .lnk.uni{border-left:3px solid var(--uni)}.sheet .lnk.typ{border-left:3px solid var(--eter)}
.verdict{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff;margin-left:4px;vertical-align:3px}
footer{max-width:1150px;margin:0 auto;padding:0 14px 30px;font-size:12px;color:var(--muted)}
/* ---- new tabs ---- */
.te{font-family:"Noto Sans Telugu",Inter,sans-serif}
.tabrow{overflow-x:auto;scrollbar-width:none;flex:1 1 600px}
.tabrow::-webkit-scrollbar{display:none}
.tabrow button{flex:0 0 auto;padding:5px 13px;line-height:1.15}
.tabrow button small{display:block;font-family:"Noto Sans Telugu",sans-serif;font-weight:500;font-size:10.5px;opacity:.75}
.lens button small{display:block;font-family:"Noto Sans Telugu",sans-serif;font-weight:500;font-size:10px;opacity:.8}
body.l-earthly .is-eternal{opacity:.22;filter:saturate(.3)}
body.l-eternal .is-earthly{opacity:.22;filter:saturate(.3)}
.h2te{font-size:15px;color:var(--muted);font-weight:500;margin-left:6px}
.svgwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.svgwrap svg{display:block}
#metroBox .ln{cursor:pointer;transition:opacity .2s}
#metroBox.sel .ln{opacity:.12}#metroBox.sel .ln.on{opacity:1}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px}
.chips2 button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.chips2 button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chips2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rest{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.rest h3{font-size:22px;margin:0;line-height:1.1}
.chain{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.chain>div{border-radius:10px;padding:7px 9px;font-size:12.5px;position:relative;transition:opacity .25s,filter .25s}
.chain .k{display:block;margin-bottom:2px;font-size:10px}
.chain .k .te{text-transform:none;letter-spacing:0;font-weight:500}
.chain .r{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.c0{background:#f6e3df;border-left:3px solid var(--evil)}.c0 .k{color:var(--evil)}
.c1{background:var(--earthbg);border-left:3px solid var(--earth)}.c1 .k{color:var(--earth)}
.c2{background:#2a2118;color:#fbf3dc}.c2 .k{color:#f1d98a}.c2 .r{color:#d9ccb0}
.c3{background:#e5f0ea;border-left:3px solid var(--good)}.c3 .k{color:var(--good)}
.c4{background:var(--eterbg);border-left:3px solid var(--eter)}.c4 .k{color:var(--eter)}
@media(max-width:820px){.chain{grid-template-columns:1fr}}
.views{background:var(--card);border:2px solid var(--mixed);border-radius:14px;padding:12px 14px;margin:6px 0 14px}
.views h3{font-size:23px;margin:0}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.vgrid>div{background:var(--soft);border-radius:10px;padding:9px 11px;font-size:12.8px}
.vgrid h4{margin:0 0 3px;font-size:14px}
.vgrid .who{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.common{margin-top:8px;font-size:12.8px;background:#e5f0ea;border-radius:10px;padding:8px 11px}
@media(max-width:820px){.vgrid{grid-template-columns:1fr}}
.gwrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:860px){.gwrap{grid-template-columns:1fr}}
.gsvg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}
.gsvg svg{width:100%;height:auto;display:block}
.gsvg .ring{cursor:pointer}.gsvg .ring:hover{filter:brightness(1.06)}
.steps{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.steps h3{font-size:22px;margin:0 0 6px}
.steps ol{margin:0;padding-left:20px;font-size:13.5px}
.steps li{margin-bottom:8px}
.steps li .r{color:var(--muted);font-size:12px}
.seedside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;margin-top:12px}

/* ---- language ---- */
body.lang-te .colhead .q{font-style:normal;font-size:15px}
.tl{display:block;font-size:.93em;color:var(--muted);margin-top:3px;line-height:1.55}
.ti{font-size:.72em;color:var(--muted);font-weight:500;font-family:"Noto Sans Telugu",sans-serif}
.christbar .tl,.c2 .tl,.colhead .tl,.colhead .ti,.christbar .ti,.c2 .ti{color:inherit;opacity:.85}
.chip.on .ti,.chips2 button.on .ti{color:inherit;opacity:.8}
body.lang-te{line-height:1.7}
body.lang-te .te{font-size:.97em}
body.lang-te h3 .te,body.lang-te h2 .te{font-family:"Noto Sans Telugu",sans-serif;font-weight:700}
body.lang-te .card h3,body.lang-te .rest h3,body.lang-te .crow h3{font-size:17px}
body.lang-te .colhead h2,body.lang-te .sheet .hd h2,body.lang-te header h1{font-size:23px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between}
header .htext{flex:1 1 520px}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);flex:0 0 auto;margin-top:6px}
.langsw button{border:0;background:none;padding:7px 13px;font-size:13px;font-weight:600}
.langsw button.on{background:var(--pro);color:#fff}
.langsw .k2{display:none}
</style>
</head>

/* ---------- DATA ---------- */
// office people (detailed). y1/y2 = BC start/end
const OFF = [
 // PROPHETS
 {id:"moses",o:"prophet",name:"Moses",y1:1446,y2:1406,when:"c. 1446–1406 BC · Exodus to Deuteronomy",
  earthly:"Spoke God's law at Sinai and led Israel out of Egypt. Mediator of the old covenant, he spoke with God “face to face, as a man speaketh unto his friend” (Exod 33:11).",
  limit:"Barred from Canaan for striking the rock (Num 20:12). Died outside the land. Faithful “as a servant” (Heb 3:5).",

  refs:"Deut 18:15–18; Num 12:7 → Acts 3:22–23; Heb 3:1–6; John 1:17",types:["moses"]},
 {id:"samuel",o:"prophet",name:"Samuel",y1:1060,y2:1010,when:"c. 1060–1010 BC · 1 Samuel",also:"Also served at the tabernacle in a linen ephod (1 Sam 2:18) and judged Israel.",
  earthly:"Last judge and first of the great prophets. Anointed both Saul and David.",
  limit:"His sons “turned aside after lucre” (1 Sam 8:3), and the people asked for a king “like all the nations” (1 Sam 8:5).",
  eternal:"Samuel anointed the anointed; Christ is the Anointed One Himself, “anointed… with the Holy Ghost and with power” (Acts 10:38). Peter says all the prophets “from Samuel” foretold these days (Acts 3:24).",
  refs:"1 Sam 3; 16:13 → Acts 3:24; 13:20–23"},
 {id:"nathan",o:"prophet",name:"Nathan",y1:1000,y2:960,when:"c. 1000–960 BC · 2 Samuel, 1 Kings 1",
  earthly:"Brought David the covenant of an everlasting house (2 Sam 7) and confronted him after Bathsheba: “Thou art the man” (2 Sam 12:7).",
  limit:"He first told David to build the temple and had to correct himself by the word of the Lord that night (2 Sam 7:3–5).",
  eternal:"“Thy throne shall be established for ever” (2 Sam 7:16) is applied to Jesus: “of his kingdom there shall be no end” (Luke 1:32–33; Acts 2:30).",
  refs:"2 Sam 7:12–16 → Luke 1:32–33; Acts 2:30; Heb 1:5"},
 {id:"elijah",o:"prophet",name:"Elijah",y1:875,y2:848,when:"c. 875–848 BC · 1 Kings 17 – 2 Kings 2",
  earthly:"Stood against Ahab, Jezebel and Baal; fire fell on Carmel (1 Ki 18). Taken up by a whirlwind.",
  limit:"Fled in despair: “O LORD, take away my life” (1 Ki 19:4). The northern kingdom did not turn.",
  eternal:"Malachi promised Elijah before the day of the Lord (Mal 4:5). Jesus says John the Baptist “is Elias, which was for to come” (Matt 11:14). Elijah stands with Christ at the Transfiguration (Matt 17:3). He prepares the way for Christ rather than picturing Him.",
  refs:"Mal 4:5 → Matt 11:14; 17:3, 10–13; Luke 1:17"},
 {id:"elisha",o:"prophet",name:"Elisha",y1:848,y2:797,when:"c. 848–797 BC · 2 Kings 2–13",
  earthly:"Healed Naaman the Syrian, raised the Shunammite's son, fed a hundred men with twenty loaves (2 Ki 4:42–44).",
  limit:"“Fallen sick of his sickness whereof he died” (2 Ki 13:14).",
  eternal:"Jesus cites Naaman to show grace reaching the Gentiles (Luke 4:27). His feeding of five thousand far exceeds Elisha's hundred, though that parallel is drawn by readers rather than stated in the text.",
  refs:"2 Ki 5; 4:42–44 → Luke 4:27; John 6:9–13"},
 {id:"jonah",o:"prophet",name:"Jonah",y1:793,y2:753,when:"c. 790–760 BC · Jonah; 2 Ki 14:25",
  earthly:"Ran from God, spent three days and nights in the fish, then preached to Nineveh, which repented.",
  limit:"Angry that God showed mercy (Jonah 4:1–3).",
  eternal:"“As Jonas was three days and three nights in the whale's belly; so shall the Son of man be three days and three nights in the heart of the earth.” “A greater than Jonas is here” (Matt 12:40–41).",
  refs:"Jonah 1–3 → Matt 12:39–41; Luke 11:29–32",types:["jonah"]},
 {id:"isaiah",o:"prophet",name:"Isaiah",y1:740,y2:681,when:"c. 740–681 BC · Uzziah to Hezekiah",
  earthly:"Called “in the year that king Uzziah died” (Isa 6:1). Counselled Ahaz and Hezekiah through the Assyrian crisis.",
  limit:"Told from the start the people would hear and not understand (Isa 6:9–10). Hebrews 11:37 (“sawn asunder”) is often linked to him by tradition, but Scripture does not record his death.",
  eternal:"“These things said Esaias, when he saw his glory, and spake of him” (John 12:41). Immanuel (7:14), the child-King (9:6–7), the suffering Servant (53).",
  refs:"Isa 6; 7:14; 9:6–7; 53 → John 12:38–41; Matt 1:23; Acts 8:32–35"},
 {id:"jeremiah",o:"prophet",name:"Jeremiah",y1:627,y2:586,when:"627–586 BC · Josiah to the fall of Jerusalem",
  earthly:"Warned Judah for forty years, through the last kings, that Babylon would come.",
  limit:"Beaten, imprisoned, thrown in a dungeon, and finally carried off to Egypt (Jer 38; 43).",
  eternal:"Promised the new covenant written on the heart (Jer 31:31–34), quoted in full in Hebrews 8:8–12, and the Branch called “THE LORD OUR RIGHTEOUSNESS” (Jer 23:5–6).",
  refs:"Jer 23:5–6; 31:31–34 → Heb 8:8–12; Luke 22:20"},
 {id:"ezekiel",o:"prophet",name:"Ezekiel",y1:593,y2:571,when:"593–571 BC · in exile in Babylon",also:"Also a priest (Ezek 1:3) who never served in the temple.",
  earthly:"Saw the glory leave the temple (Ezek 10–11) and the dry bones live (Ezek 37).",
  limit:"A priest in exile with no temple; spoke to captives.",
  eternal:"“I will set up one shepherd over them… even my servant David” (Ezek 34:23), fulfilled in “I am the good shepherd… one fold, and one shepherd” (John 10:11, 16).",
  refs:"Ezek 34:11–24; 37:24–25 → John 10:11–16; Heb 13:20"},
 {id:"daniel",o:"prophet",name:"Daniel",y1:605,y2:536,when:"605–536 BC · Babylon and Persia",
  earthly:"Served in the courts of Nebuchadnezzar, Belshazzar and Darius.",
  limit:"Lived his whole life in exile; the kingdom was not restored in his day.",
  eternal:"A stone cut without hands becomes a kingdom “which shall never be destroyed” (Dan 2:44). One “like the Son of man” receives “an everlasting dominion” (Dan 7:13–14), the title Jesus claims before the high priest (Matt 26:64).",
  refs:"Dan 2:34–45; 7:13–14 → Matt 26:64; Rev 1:13"},
 {id:"malachi",o:"prophet",name:"Malachi",y1:440,y2:420,when:"c. 430 BC · after the return",
  earthly:"Last of the Old Testament prophets, rebuking careless priests and people.",
  limit:"After him, about four hundred years without a recorded prophet.",
  eternal:"“I will send my messenger, and he shall prepare the way before me” (Mal 3:1), applied to John the Baptist going before Jesus (Mark 1:2). Then God “hath in these last days spoken unto us by his Son” (Heb 1:2).",
  refs:"Mal 3:1; 4:5–6 → Mark 1:2; Heb 1:1–2"},
 // PRIESTS
 {id:"melchizedek",o:"priest",o2:"king",name:"Melchizedek",y1:2085,y2:2085,when:"Time of Abraham · Genesis 14",
  earthly:"King of Salem and priest of the most high God. Brought bread and wine and blessed Abram, who gave him a tenth (Gen 14:18–20).",
  limit:"Only three verses in Genesis. Hebrews' “without father, without mother” (Heb 7:3) describes the silence of the record, which is the point of the type.",
  eternal:"“Thou art a priest for ever after the order of Melchizedek” (Ps 110:4; Heb 5:6). Priest and king in one, a priesthood “after the power of an endless life” (Heb 7:16), not by descent from Levi.",
  refs:"Gen 14:18–20; Ps 110:4 → Heb 5:6–10; 7:1–28",types:["melchizedek"]},
 {id:"aaron",o:"priest",name:"Aaron",y1:1446,y2:1407,when:"c. 1446–1407 BC · Exodus to Numbers",
  earthly:"First high priest. Wore the breastplate with the twelve tribes and entered the holiest once a year on the Day of Atonement (Lev 16).",
  limit:"Made the golden calf (Exod 32). Offered first for his own sins (Heb 5:3). Died on Mount Hor (Num 20:28).",
  eternal:"Christ was called of God “as was Aaron” (Heb 5:4–5), but is “holy, harmless, undefiled”, and offered Himself once (Heb 7:26–27), entering “into heaven itself” (Heb 9:24).",
  refs:"Exod 28; Lev 16 → Heb 5:1–10; 7:26–28; 9:24",types:["highpriest","atonement"]},
 {id:"eli",o:"priest",name:"Eli",y1:1100,y2:1060,when:"c. 1100–1060 BC · 1 Samuel 1–4",
  earthly:"High priest at Shiloh who raised the boy Samuel.",
  limit:"Would not restrain his sons (1 Sam 3:13). The ark was captured and the glory departed: “Ichabod” (1 Sam 4:21).",
  eternal:"God promised “a faithful priest, that shall do according to that which is in mine heart” (1 Sam 2:35). Zadok's line partly fulfilled it, but Hebrews calls Christ “a merciful and faithful high priest” (Heb 2:17). The link to Christ is drawn by interpreters.",
  refs:"1 Sam 2:27–36 → Heb 2:17; 3:1–2"},
 {id:"abiathar",o:"priest",name:"Ahimelech & Abiathar",y1:1020,y2:970,when:"c. 1020–970 BC · Saul and David",
  earthly:"Ahimelech gave the fleeing David the shewbread at Nob (1 Sam 21). Saul massacred the priests for it (1 Sam 22). Abiathar escaped and served David.",
  limit:"Solomon banished Abiathar for backing Adonijah, fulfilling the word against Eli's house (1 Ki 2:27).",
  eternal:"Jesus cites David eating the shewbread “in the days of Abiathar” (Mark 2:26) and adds, “in this place is one greater than the temple” and “the Son of man is Lord even of the sabbath” (Matt 12:6, 8).",
  refs:"1 Sam 21–22 → Mark 2:25–28; Matt 12:3–8"},
 {id:"zadok",o:"priest",name:"Zadok",y1:1000,y2:960,when:"c. 1000–960 BC · David and Solomon",
  earthly:"Stayed loyal to David and anointed Solomon king (1 Ki 1:39). His line held the high priesthood until the exile, and Ezekiel's future temple is served by “the sons of Zadok” (Ezek 44:15).",
  limit:"Still a line of dying men: “they truly were many priests, because they were not suffered to continue by reason of death” (Heb 7:23).",
  eternal:"Christ “because he continueth ever, hath an unchangeable priesthood” (Heb 7:24).",
  refs:"1 Ki 1:32–40; Ezek 44:15 → Heb 7:23–25"},
 {id:"jehoiada",o:"priest",name:"Jehoiada",y1:841,y2:800,when:"c. 841–800 BC · Athaliah and Joash",
  earthly:"Hid the infant Joash from Athaliah for six years, crowned him, and led a covenant renewal (2 Ki 11). Buried “among the kings” (2 Chr 24:16).",
  limit:"After his death Joash turned to idols and stoned Jehoiada's son Zechariah in the temple court (2 Chr 24:17–22).",
  eternal:"By hiding one child he kept the royal seed of David alive when it was nearly wiped out (2 Ki 11:1–2), so the line to Christ stood (Matt 1). Jesus' words about Zacharias slain “between the altar and the temple” (Luke 11:51) are usually taken to mean his son, though the name in Matthew 23:35 is debated.",
  refs:"2 Ki 11; 2 Chr 24 → Matt 1:6–16; Luke 11:51"},
 {id:"azariah",o:"priest",name:"Azariah",y1:760,y2:750,when:"c. 750 BC · reign of Uzziah",
  earthly:"With eighty priests he withstood King Uzziah when the king went in to burn incense: “It appertaineth not unto thee” (2 Chr 26:18).",
  limit:"Uzziah was struck with leprosy, but the kingdom kept sliding.",
  eternal:"In Israel the throne and the altar were kept apart. Christ comes from Judah, “of which tribe Moses spake nothing concerning priesthood” (Heb 7:14), yet holds both by God's oath (Ps 110:1, 4).",
  refs:"2 Chr 26:16–21 → Heb 7:13–17"},
 {id:"hilkiah",o:"priest",name:"Hilkiah",y1:625,y2:620,when:"622 BC · reign of Josiah",
  earthly:"Found the book of the law while the temple was being repaired (2 Ki 22:8), which set off Josiah's reform.",
  limit:"The reform did not change the nation's heart; Jerusalem fell within forty years.",
  eternal:"The law found in a book points to the law written on hearts: “I will put my laws into their mind, and write them in their hearts” (Jer 31:33; Heb 8:10).",
  refs:"2 Ki 22–23 → Heb 8:10; 2 Cor 3:3"},
 {id:"seraiah",o:"priest",name:"Seraiah",y1:595,y2:586,when:"586 BC · the fall of Jerusalem",
  earthly:"The chief priest when Jerusalem fell, executed by Nebuchadnezzar at Riblah (2 Ki 25:18–21).",
  limit:"The temple was burned and the earthly priesthood's center was gone.",
  eternal:"“Destroy this temple, and in three days I will raise it up… he spake of the temple of his body” (John 2:19–21).",
  refs:"2 Ki 25:8–21 → John 2:19–21"},
 {id:"joshua",o:"priest",o2:"king",name:"Joshua (Jeshua)",y1:538,y2:515,when:"538–515 BC · the return",
  earthly:"High priest of the returning exiles. Zechariah saw his filthy garments replaced (Zech 3) and then a crown set on his head: “the BRANCH… shall be a priest upon his throne” (Zech 6:11–13).",
  limit:"Joshua himself never ruled. The crowns were laid up in the temple as a memorial (Zech 6:14).",
  eternal:"His name is the Hebrew form of “Jesus”. The New Testament does not quote Zechariah 6, but it describes Christ as exactly this: “an high priest, who is set on the right hand of the throne” (Heb 8:1).",
  refs:"Zech 3; 6:9–15 → Heb 8:1; 10:12"},
 {id:"ezra",o:"priest",name:"Ezra",y1:458,y2:440,when:"458 BC onward · Ezra–Nehemiah",
  earthly:"Priest and scribe who “prepared his heart to seek the law of the LORD, and to do it, and to teach” (Ezra 7:10). Read the law to the people (Neh 8).",
  limit:"The people slid back into the same sins (Neh 13).",
  eternal:"Christ opened the Scriptures: “beginning at Moses and all the prophets, he expounded unto them… the things concerning himself” (Luke 24:27).",
  refs:"Ezra 7; Neh 8 → Luke 24:27, 44–45"},
 // KINGS
 {id:"saul",o:"king",name:"Saul",y1:1050,y2:1010,when:"1050–1010 BC · United kingdom",counter:true,
  earthly:"The people's choice, a king “like all the nations” (1 Sam 8:5). Won early victories.",
  limit:"Offered the burnt offering himself instead of waiting for Samuel (1 Sam 13:9–13). Spared Amalek (1 Sam 15). Died by his own sword.",

  refs:"1 Sam 8–31 → Acts 13:21–23"},
 {id:"david",o:"king",name:"David",y1:1010,y2:970,when:"1010–970 BC · United kingdom",
  earthly:"Shepherd boy anointed king, a man after God's own heart. Took Jerusalem and received the covenant of an everlasting throne (2 Sam 7).",
  limit:"Adultery and murder (2 Sam 11). Not allowed to build the temple (1 Chr 22:8). “He is both dead and buried” (Acts 2:29).",
  eternal:"Jesus is the Son of David whose kingdom has no end (Luke 1:32–33), and also David's Lord (Ps 110:1; Matt 22:41–45): “the root and the offspring of David” (Rev 22:16).",
  refs:"1 Sam 16; 2 Sam 7; Ps 110:1 → Luke 1:32–33; Acts 2:29–36; Rev 22:16",types:["david"]},
 {id:"solomon",o:"king",name:"Solomon",y1:970,y2:931,when:"970–931 BC · United kingdom",
  earthly:"Wisdom, wealth and peace. Built the temple; the kingdom at its height.",
  limit:"“His wives turned away his heart after other gods” (1 Ki 11:4). The kingdom split after him.",
  eternal:"“A greater than Solomon is here” (Matt 12:42). Christ is “made unto us wisdom” (1 Cor 1:30) and builds the true temple of living stones (Eph 2:20–22).",
  refs:"1 Ki 3–11 → Matt 12:42; 1 Cor 1:24, 30; Eph 2:20–22",types:["solomon","temple"]},
 {id:"jeroboam1",o:"king",name:"Jeroboam I",y1:931,y2:910,when:"931–910 BC · Israel",counter:true,
  earthly:"Led the ten tribes away from David's house. Set up golden calves at Bethel and Dan and made priests “of the lowest of the people” (1 Ki 12:28–31).",
  limit:"“The sin of Jeroboam” became the verdict on almost every northern king. Israel never had a king who did right.",
  eternal:"A counter-type: worship and priesthood made by man to hold power. Christ is the true way to the Father and the true worship “in spirit and in truth” (John 4:23; 14:6).",
  refs:"1 Ki 12:25–33 → John 4:21–24; 14:6"},
 {id:"uzziah",o:"king",name:"Uzziah",y1:792,y2:740,when:"792–740 BC · Judah",
  earthly:"Fifty-two years of strength and prosperity (2 Chr 26:1–15).",
  limit:"“When he was strong, his heart was lifted up” and he went in to burn incense. Struck with leprosy until his death (2 Chr 26:16–21).",
  eternal:"“In the year that king Uzziah died I saw also the Lord sitting upon a throne” (Isa 6:1). The earthly king who grasped at the priesthood dies; the eternal King is seen. John says Isaiah saw Christ's glory (John 12:41).",
  refs:"2 Chr 26; Isa 6:1 → John 12:41"},
 {id:"hezekiah",o:"king",name:"Hezekiah",y1:715,y2:686,when:"715–686 BC · Judah",
  earthly:"Trusted God against Assyria and reformed worship. Broke in pieces the brass serpent Moses had made, because Israel burned incense to it (2 Ki 18:4).",
  limit:"Showed his treasures to Babylon's envoys; Isaiah foretold the exile (Isa 39:6). His son Manasseh was Judah's worst king.",
  eternal:"The brass serpent was a type (John 3:14), not an object of worship. The pointer had to be destroyed when it was mistaken for the reality.",
  refs:"2 Ki 18–20 → John 3:14–15",types:["serpent"]},
 {id:"josiah",o:"king",name:"Josiah",y1:640,y2:609,when:"640–609 BC · Judah",
  earthly:"The great reformer: “like unto him was there no king before him” (2 Ki 23:25).",
  limit:"“Notwithstanding the LORD turned not from the fierceness of his great wrath” (2 Ki 23:26). Killed at Megiddo by Pharaoh Necho.",
  eternal:"Even the best reform could not change hearts; Jeremiah, called in Josiah's reign, promised a new covenant that would (Jer 31:33). The national mourning for Josiah (2 Chr 35:25) is echoed in Zechariah's mourning “for him whom they have pierced” (Zech 12:10–11), which John applies to the cross (John 19:37).",
  refs:"2 Ki 22–23; Zech 12:10–11 → John 19:37; Heb 8:6–13"},
 {id:"jehoiachin",o:"king",name:"Jehoiachin (Coniah)",y1:598,y2:597,when:"598–597 BC · Judah",
  earthly:"Reigned three months, then was carried to Babylon. Released from prison in 562 BC and fed at the king's table (2 Ki 25:27–30).",
  limit:"“Write ye this man childless… no man of his seed shall prosper, sitting upon the throne of David” (Jer 22:30).",
  eternal:"He appears as Jechonias in Matthew's genealogy (Matt 1:11–12), the legal line through Joseph. Many interpreters see the virgin birth as how the throne passes to Christ without breaking Jeremiah's word; that is an inference, not a New Testament statement.",
  refs:"Jer 22:24–30; 2 Ki 25:27–30 → Matt 1:11–16; Luke 3:23"},
 {id:"zedekiah",o:"king",name:"Zedekiah",y1:597,y2:586,when:"597–586 BC · last king of Judah",
  earthly:"Babylon's puppet who rebelled. Blinded after seeing his sons killed; Jerusalem burned (2 Ki 25:7).",
  limit:"The end of the earthly throne of David.",
  eternal:"“Remove the diadem, and take off the crown… until he come whose right it is; and I will give it him” (Ezek 21:26–27). The crown is set aside for the true heir: “the Lord God shall give unto him the throne of his father David” (Luke 1:32).",
  refs:"Ezek 21:25–27; 2 Ki 25 → Luke 1:32–33"},
 {id:"zerubbabel",o:"king",name:"Zerubbabel",y1:538,y2:515,when:"538–515 BC · governor after the return",
  earthly:"Grandson of Jehoiachin and governor of Judah under Persia. Laid the foundation of the second temple.",
  limit:"Never a king, only a governor; the second temple was small beside the first (Hag 2:3).",
  eternal:"“I will make thee as a signet” (Hag 2:23), reversing the signet torn from Coniah (Jer 22:24). He stands in both genealogies of Jesus (Matt 1:12–13; Luke 3:27). “The glory of this latter house shall be greater than of the former” (Hag 2:9).",
  refs:"Hag 2:20–23; Zech 4 → Matt 1:12–13; Luke 3:27"}
];

 malachi:{name:"మలాకీ",when:"సుమారు క్రీ.పూ. 430 · చెరనుండి తిరిగివచ్చిన తరువాత",

 melchizedek:{name:"మెల్కీసెదెకు",when:"అబ్రాహాము కాలము · ఆదికాండము 14",
  earthly:"షాలేము రాజును సర్వోన్నతుడగు దేవునికి యాజకుడును. రొట్టెయు ద్రాక్షారసమును తెచ్చి అబ్రామును ఆశీర్వదించెను; అబ్రాము అతనికి దశమభాగమిచ్చెను (ఆది. 14:18–20).",

 aaron:{name:"అహరోను",when:"సుమారు క్రీ.పూ. 1446–1407 · నిర్గమకాండము నుండి సంఖ్యాకాండము",
  earthly:"మొదటి ప్రధానయాజకుడు. పండ్రెండు గోత్రముల పేర్లుగల పతకమును ధరించి, సంవత్సరమునకు ఒకసారి ప్రాయశ్చిత్తదినమున అతిపరిశుద్ధస్థలములో ప్రవేశించెను (లేవీ. 16).",

 eli:{name:"ఏలీ",when:"సుమారు క్రీ.పూ. 1100–1060 · 1 సమూయేలు 1–4",

  eternal:"నా హృదయాభిప్రాయముచొప్పున జరిగించు నమ్మకమైన యాజకుని నేను నియమించెదనని దేవుడు సెలవిచ్చెను (1 సమూ. 2:35). సాదోకు వంశము దీనిని కొంతమట్టుకు నెరవేర్చెను; హెబ్రీయులకు వ్రాసిన పత్రిక క్రీస్తును కనికరముగల నమ్మకమైన ప్రధానయాజకుడని పిలుచుచున్నది (హెబ్రీ. 2:17). క్రీస్తుతో ఈ సంబంధమును వ్యాఖ్యాతలు చూపిరి."},
 abiathar:{name:"అహీమెలెకు, అబ్యాతారు",when:"సుమారు క్రీ.పూ. 1020–970 · సౌలు, దావీదు",

 zadok:{name:"సాదోకు",when:"సుమారు క్రీ.పూ. 1000–960 · దావీదు, సొలొమోను",

 jehoiada:{name:"యెహోయాదా",when:"సుమారు క్రీ.పూ. 841–800 · అతల్యా, యోవాషు",

  eternal:"ఒక్క బాలుని దాచుటచేత, దావీదు రాజసంతతి దాదాపు నశించిన సమయములో దానిని కాపాడెను (2 రాజు. 11:1–2); అందువలన క్రీస్తు వరకు ఆ వంశము నిలిచెను (మత్త. 1). బలిపీఠమునకును దేవాలయమునకును మధ్య చంపబడిన జెకర్యా (లూకా 11:51) అని యేసు చెప్పినది సాధారణముగా ఇతని కుమారునిగా తీసికొనబడును; మత్త. 23:35 లోని పేరు విషయము వాదనలో ఉన్నది."},
 azariah:{name:"అజర్యా",when:"సుమారు క్రీ.పూ. 750 · ఉజ్జియా పరిపాలన",

 hilkiah:{name:"హిల్కీయా",when:"క్రీ.పూ. 622 · యోషీయా పరిపాలన",

 seraiah:{name:"శెరాయా",when:"క్రీ.పూ. 586 · యెరూషలేము పతనము",

 joshua:{name:"యెహోషువ (యేషూవ)",when:"క్రీ.పూ. 538–515 · చెరనుండి తిరిగిరాక",

  limit:"యెహోషువ స్వయముగా ఎన్నడును పరిపాలించలేదు. ఆ కిరీటములు జ్ఞాపకార్థముగా మందిరములో ఉంచబడెను (జెక. 6:14).",
  eternal:"అతని పేరు ‘యేసు’ అను పేరు యొక్క హెబ్రీ రూపము. క్రొత్త నిబంధన జెకర్యా 6ను ఉదహరించదు, అయినను క్రీస్తును సరిగా ఇట్లే వర్ణించుచున్నది: పరలోకమందు మహామహుని సింహాసనమునకు కుడిపార్శ్వమున కూర్చుండిన ప్రధానయాజకుడు (హెబ్రీ. 8:1)."},
 ezra:{name:"ఎజ్రా",when:"క్రీ.పూ. 458 నుండి · ఎజ్రా–నెహెమ్యా",
  earthly:"యెహోవా ధర్మశాస్త్రమును పరిశోధించి దాని చొప్పున నడచుకొనుటకును బోధించుటకును మనస్సు నిలుపుకొనిన యాజకుడును శాస్త్రియును (ఎజ్రా 7:10). జనులకు ధర్మశాస్త్రము చదివి వినిపించెను (నెహె. 8).",

 saul:{name:"సౌలు",when:"క్రీ.పూ. 1050–1010 · ఐక్య రాజ్యము",
  earthly:"జనులు కోరుకొనిన రాజు; సమస్త జనములవలె ఒక రాజు (1 సమూ. 8:5). ఆరంభములో జయములు పొందెను.",

 david:{name:"దావీదు",when:"క్రీ.పూ. 1010–970 · ఐక్య రాజ్యము",

 jeroboam1:{name:"మొదటి యరొబాము",when:"క్రీ.పూ. 931–910 · ఇశ్రాయేలు",

 hezekiah:{name:"హిజ్కియా",when:"క్రీ.పూ. 715–686 · యూదా",
  earthly:"అష్షూరు ఎదుట దేవుని నమ్ముకొని ఆరాధనను సంస్కరించెను. మోషే చేసిన ఇత్తడి సర్పమునకు ఇశ్రాయేలీయులు ధూపము వేయుచుండిరి గనుక దానిని తుత్తునియలుగా విరుగగొట్టెను (2 రాజు. 18:4).",

 josiah:{name:"యోషీయా",when:"క్రీ.పూ. 640–609 · యూదా",

  limit:"అయినను యెహోవా తన మహోగ్రతనుండి తిరుగలేదు (2 రాజు. 23:26). మెగిద్దోలో ఫరో నెకోచేత చంపబడెను.",
  eternal:"అత్యుత్తమ సంస్కరణకూడ హృదయములను మార్చలేకపోయెను; యోషీయా దినములలో పిలువబడిన యిర్మీయా హృదయములను మార్చు క్రొత్త నిబంధనను వాగ్దానము చేసెను (యిర్మీ. 31:33). యోషీయా నిమిత్తము జరిగిన విలాపము (2 దిన. 35:25) తాము పొడిచినవానిని చూచి చేయు విలాపమునందు ప్రతిధ్వనించును (జెక. 12:10–11); యోహాను దానిని సిలువకు అన్వయించెను (యోహా. 19:37)."},
 jehoiachin:{name:"యెహోయాకీను (కొన్యా)",when:"క్రీ.పూ. 598–597 · యూదా",
  earthly:"మూడు నెలలు ఏలి బబులోనునకు కొనిపోబడెను. క్రీ.పూ. 562లో చెరసాలనుండి విడిపింపబడి రాజు బల్లయొద్ద భోజనము చేసెను (2 రాజు. 25:27–30).",
  limit:"సంతానహీనుడని ఈ మనుష్యునిగూర్చి వ్రాయుడి… అతని సంతానములో ఎవడును దావీదు సింహాసనముమీద కూర్చుండి వర్ధిల్లడు (యిర్మీ. 22:30).",
  eternal:"మత్తయి వంశావళిలో యెకొన్యాగా కనబడుచున్నాడు (మత్త. 1:11–12) — యోసేపు ద్వారా చట్టబద్ధమైన వంశము. యిర్మీయా మాట భంగము కాకుండ సింహాసనము క్రీస్తునకు చేరిన విధానము కన్యకాజననమే అని అనేకులు భావించుదురు; ఇది అనుమానము, క్రొత్త నిబంధన స్పష్టముగా చెప్పినది కాదు."},
 zedekiah:{name:"సిద్కియా",when:"క్రీ.పూ. 597–586 · యూదా చివరి రాజు",
  earthly:"బబులోను నియమించిన రాజు, తిరుగుబాటు చేసెను. తన కుమారులు చంపబడుట చూచిన పిమ్మట అతని కన్నులు ఊడదీయబడెను; యెరూషలేము కాల్చబడెను (2 రాజు. 25:7).",
  limit:"దావీదు భూలోక సింహాసనమునకు అంతము.",
  eternal:"తలపాగాను తీసివేయుము, కిరీటమును ఎత్తుము… హక్కుదారుడు వచ్చువరకు అది యుండదు; అప్పుడు దానిని అతనికిచ్చెదను (యెహె. 21:26–27). నిజమైన వారసుని కొరకు కిరీటము ఉంచబడెను: ప్రభువైన దేవుడు ఆయన తండ్రియైన దావీదు సింహాసనమును ఆయనకిచ్చును (లూకా 1:32)."},
 zerubbabel:{name:"జెరుబ్బాబెలు",when:"క్రీ.పూ. 538–515 · తిరిగివచ్చిన తరువాత అధికారి",
  earthly:"యెహోయాకీను మనుమడు; పారసీకుల క్రింద యూదాకు అధికారి. రెండవ మందిరపు పునాది వేసెను.",
  limit:"ఎన్నడును రాజు కాలేదు, అధికారి మాత్రమే; రెండవ మందిరము మొదటిదానితో పోల్చగా అల్పముగా నుండెను (హగ్గ. 2:3).",
  eternal:"నిన్ను ముద్ర ఉంగరముగా చేసెదను (హగ్గ. 2:23) — కొన్యానుండి తీసివేయబడిన ముద్ర ఉంగరమునకు (యిర్మీ. 22:24) ఇది విరుద్ధము. యేసు వంశావళులు రెండిటిలోను ఇతడున్నాడు (మత్త. 1:12–13; లూకా 3:27). ఈ కడవరి మందిరపు మహిమ మునుపటి మందిరపు మహిమకంటె అధికమగును (హగ్గ. 2:9)."}
};
TE.christ={
 prophet:{t:"ప్రవక్తయైన క్రీస్తు",q:"దేవుడు… ఈ దినముల అంతమందు కుమారుని ద్వారా మనతో మాటలాడెను (హెబ్రీ. 1:1–2)",p:"ప్రవక్తలు వాక్యమును మోసికొనివచ్చిరి; ఆయనే శరీరధారియైన వాక్యము (యోహా. 1:1, 14). మోషేవంటి ప్రవక్త (అపొ. 3:22)."},
 priest:{t:"యాజకుడైన క్రీస్తు",q:"నీవు మెల్కీసెదెకు క్రమము చొప్పున నిరంతరము యాజకుడవు (హెబ్రీ. 5:6)",p:"ఒక్క అర్పణ, ఒక్కసారే, తన స్వరక్తముతో పరలోకములోనికే (హెబ్రీ. 9:12, 24; 10:12). మనకొరకు విజ్ఞాపనము చేయుటకు ఆయన నిరంతరము జీవించుచున్నాడు (హెబ్రీ. 7:25)."},
 king:{t:"రాజైన క్రీస్తు",q:"ఆయన రాజ్యము అంతములేనిదై యుండును (లూకా 1:33)",p:"దావీదు కుమారుడును దావీదు ప్రభువును (మత్త. 22:42–45). నా రాజ్యము ఈ లోకసంబంధమైనది కాదు (యోహా. 18:36). రాజులకు రాజు (ప్రక. 19:16)."}
};

 jeroboam1:["మొదటి యరొబాము","బేతేలు, దానులలో బంగారు దూడలు."],nadab:["నాదాబు","బయెషాచేత చంపబడెను."],baasha:["బయెషా","యరొబాము ఇంటిని నాశనముచేసి అతని పాపములోనే నడచెను."],elah:["ఏలా","త్రాగి మత్తుడైయుండగా చంపబడెను."],zimri:["జిమ్రీ","ఏడు దినములు ఏలెను."],omri:["ఒమ్రీ","షోమ్రోనును కట్టెను."],ahab:["అహాబు","యెజెబెలును పెండ్లిచేసికొనెను; బయలు పూజ; ఏలీయా ఎదిరించెను."],ahaziahI:["అహజ్యా","బయల్జెబూబునొద్ద విచారించెను."],joramI:["యెహోరాము","యెహూచేత చంపబడెను."],jehu:["యెహూ","బయలు పూజను నాశనముచేసెను గాని దూడలను ఉంచెను."],jehoahazI:["యెహోయాహాజు","సిరియనులచేత బాధింపబడెను."],jehoashI:["యెహోయాషు","మరణశయ్యమీదనున్న ఎలీషాను దర్శించెను."],jeroboam2:["రెండవ యరొబాము","అభివృద్ధి; యోనా, ఆమోసు, హోషేయ పరిచర్య."],zechariahI:["జెకర్యా","ఆరు నెలలు; యెహూ వంశమునకు అంతము."],shallum:["షల్లూము","ఒక నెల."],menahem:["మెనహేము","అష్షూరునకు కప్పము చెల్లించెను."],pekahiah:["పెకహ్యా","పెకహుచేత చంపబడెను."],pekah:["పెకహు","పోటీ పరిపాలన; యూదాకు విరోధముగా సిరియాతో జతకట్టెను."],hoshea:["హోషేయ","చివరి రాజు; షోమ్రోను అష్షూరుచేత పడెను."],
 rehoboam:["రెహబాము","అతని కఠినమైన జవాబు రాజ్యమును రెండుగా చేసెను."],abijah:["అబీయా","తన తండ్రి పాపములలో నడచెను."],asa:["ఆసా","విగ్రహములను తీసివేసెను; తరువాత సిరియాను ఆశ్రయించెను."],jehoshaphat:["యెహోషాపాతు","ధర్మశాస్త్రము బోధించుటకు బోధకులను పంపెను; అహాబుతో సంబంధము చేసికొనెను."],jehoram:["యెహోరాము","అహాబు కుమార్తెను పెండ్లిచేసికొనెను."],ahaziahJ:["అహజ్యా","యెహూచేత చంపబడెను."],athaliah:["అతల్యా","రాజసంతతిని నాశనము చేయ ప్రయత్నించెను."],joash:["యోవాషు","యెహోయాదా బ్రదికియున్నంతకాలము మంచివాడు, తరువాత తొలగిపోయెను."],amaziah:["అమజ్యా","యథార్థముగా ప్రవర్తించెను గాని పూర్ణహృదయముతో కాదు."],uzziah:["ఉజ్జియా","బలవంతుడు; ధూపము వేసినందుకు కుష్ఠరోగియాయెను."],jotham:["యోతాము","యథార్థముగా ప్రవర్తించెను; జనులు ఇంకను చెడిపోయిరి."],ahaz:["ఆహాజు","యెషయా సూచనను తిరస్కరించెను; దమస్కు బలిపీఠపు నమూనాను అనుకరించెను."],hezekiah:["హిజ్కియా","అష్షూరు ఎదుట దేవుని నమ్ముకొనెను."],manasseh:["మనష్షే","రాజులలో అతి దుష్టుడు; చివరకు మారుమనస్సు పొందెను."],amon:["ఆమోను","తన సేవకులచేత చంపబడెను."],josiah:["యోషీయా","ధర్మశాస్త్ర గ్రంథము కనుగొనబడెను; గొప్ప సంస్కరణ."],jehoahazJ:["యెహోయాహాజు","మూడు నెలలు; ఐగుప్తునకు కొనిపోబడెను."],jehoiakim:["యెహోయాకీము","యిర్మీయా గ్రంథపు చుట్టను కాల్చెను."],jehoiachin:["యెహోయాకీను","బబులోనునకు కొనిపోబడెను."],zedekiah:["సిద్కియా","చివరి రాజు; యెరూషలేము కాల్చబడెను."],zerubbabel:["జెరుబ్బాబెలు","రాజు కాడు, అధికారి; మందిరమును తిరిగి కట్టెను."]

TE.prophets={samuel:["సమూయేలు"],gad:["గాదు","దావీదునకు దీర్ఘదర్శి (1 సమూ. 22:5; 2 సమూ. 24)."],nathan:["నాతాను"],ahijah:["అహీయా","వస్త్రమును పండ్రెండు ముక్కలుగా చింపెను (1 రాజు. 11:29–39)."],elijah:["ఏలీయా"],micaiah:["మీకాయా","అహాబు మరణమును ముందుగా తెలిపెను (1 రాజు. 22)."],elisha:["ఎలీషా"],joel:["యోవేలు","కాలము వాదనలో ఉన్నది; ఆత్మ కుమ్మరింపబడుట (యోవే. 2:28; అపొ. 2:16)."],jonah:["యోనా"],amos:["ఆమోసు","ఇశ్రాయేలులో న్యాయము; పడిపోయిన దావీదు గుడారము మరల లేపబడుట (ఆమో. 9:11; అపొ. 15:16)."],hosea:["హోషేయ","ద్రోహియైన ఇశ్రాయేలుపట్ల దేవుని నమ్మకమైన ప్రేమ; ఐగుప్తులోనుండి నా కుమారుని పిలిచితిని (హోషే. 11:1)."],isaiah:["యెషయా"],micah:["మీకా","బేత్లెహేమునుండి ఏలువాడు (మీకా 5:2; మత్త. 2:6)."],nahum:["నహూము","నీనెవె పతనము."],zephaniah:["జెఫన్యా","యెహోవా దినము."],jeremiah:["యిర్మీయా"],habakkuk:["హబక్కూకు","నీతిమంతుడు విశ్వాసమూలముగా బ్రదుకును (హబ. 2:4; రోమా. 1:17)."],daniel:["దానియేలు"],ezekiel:["యెహెజ్కేలు"],obadiah:["ఓబద్యా","ఎదోమునకు విరోధముగా; కాలము వాదనలో ఉన్నది."],haggai:["హగ్గయి","ఈ కడవరి మందిరపు మహిమ (హగ్గ. 2:9)."],zechariahP:["జెకర్యా","చిగురు; గాడిదనెక్కి వచ్చు రాజు (జెక. 9:9; మత్త. 21:5)."],malachi:["మలాకీ"]};
TE.priests={eli:["ఏలీ"],abiathar:["అహీమెలెకు, అబ్యాతారు"],zadok:["సాదోకు"],jehoiada:["యెహోయాదా"],azariah:["అజర్యా"],urijah:["ఊరియా","దమస్కు నమూనాపై ఆహాజు బలిపీఠమును కట్టెను (2 రాజు. 16:10–16)."],hilkiah:["హిల్కీయా"],seraiah:["శెరాయా"],joshua:["యెహోషువ"],ezra:["ఎజ్రా"]};
TE.events={1003:"యెరూషలేము పట్టబడెను",959:"మొదటి మందిర ప్రతిష్ఠ",931:"రాజ్యము రెండాయెను",722:"షోమ్రోను అష్షూరుచేత పడెను",701:"సన్హెరీబు వెనుకకు త్రిప్పబడెను",605:"మొదటి చెర బబులోనుకు",586:"యెరూషలేము, మందిరము కాల్చబడెను",538:"కోరెషు ఆజ్ఞ; తిరిగిరాక",516:"రెండవ మందిరము పూర్తి",445:"ప్రాకారములు తిరిగి కట్టబడెను"};
TE.prom=[
 ["నిత్యమైన సింహాసనము","దావీదు కుమారుడు; అతని సింహాసనము నిత్యము స్థిరపరచబడును."],
 ["నిరంతర యాజక-రాజు","దేవుని కుడిపార్శ్వమున కూర్చుండిన దావీదు ప్రభువు; మెల్కీసెదెకు క్రమము చొప్పున నిరంతర యాజకుడు."],
 ["సింహాసనాసీనుడైన కుమారుడు","నేను నా పరిశుద్ధ పర్వతమైన సీయోనుమీద నా రాజును ఆసీనునిగా చేసియున్నాను; నీవు నా కుమారుడవు."],
 ["ఇమ్మానుయేలు","విశ్వాసములేని ఆహాజునకు ఇయ్యబడిన సూచన: కన్యక గర్భవతియై కుమారుని కనును."],
 ["దావీదు సింహాసనముమీది శిశువు","ఆయన ప్రభుత్వమునకును సమాధానమునకును అంతము లేదు."],
 ["బేత్లెహేమునుండి ఏలువాడు","పురాతన కాలము మొదలుకొని, అనాదికాలము మొదలుకొని ఆయన ఉత్పత్తి కలిగియున్నది."],
 ["శ్రమపడు సేవకుడు","యాజకుడును అర్పణయు ఒక్కరే: ఆయన అనేకుల పాపమును భరించెను."],
 ["నీతిచిగురు","రాజుగా ఏలి వర్ధిల్లునొకడు: యెహోవా మనకు నీతి."],
 ["నాశనము కాని రాజ్యము","చేతిసహాయము లేక తీయబడిన రాయి భూమియంతటను నిండెను."],
 ["క్రొత్త నిబంధన","హృదయముమీద వ్రాయబడు ధర్మశాస్త్రము; పాపములు ఇక జ్ఞాపకము చేసికొనబడవు."],
 ["హక్కుదారుడు వచ్చువరకు","సిద్కియానుండి కిరీటము తీసివేయబడి నిజమైన వారసుని కొరకు ఉంచబడెను."],
 ["ఒక్కడే కాపరి","నా సేవకుడైన దావీదు వారికి కాపరిగా ఉండును."],
 ["మనుష్యకుమారుని ఆధిపత్యము","గతించిపోని శాశ్వతమైన ఆధిపత్యము."],
 ["సింహాసనముమీది యాజకుడు","చిగురు మందిరమును కట్టి మహిమను వహించును; యాజకుడును రాజును ఆయనే."],
 ["గాడిదనెక్కి వచ్చు రాజు","నీ రాజు దీనుడై గాడిదనెక్కి నీయొద్దకు వచ్చుచున్నాడు."],
 ["దూతయు ప్రభువును","ముందుగా ఒక దూత; తరువాత ప్రభువు హఠాత్తుగా తన ఆలయమునకు వచ్చును."]
];
TE.themes=[
 ["రాజ్యము","ఇశ్రాయేలు, యూదా: ఐక్యముగా, 931లో విభజింపబడి, 722లోను 586లోను అంతమాయెను.","ఎన్నటికిని నాశనము కాని రాజ్యము (దాని. 2:44); ఈ లోకసంబంధమైనది కాదు (యోహా. 18:36)."],
 ["సింహాసనము","యెరూషలేములో దావీదు సింహాసనము; సిద్కియానుండి కిరీటము తీసివేయబడెను (యెహె. 21:26).","ప్రభువైన దేవుడు ఆయన తండ్రియైన దావీదు సింహాసనమును ఆయనకిచ్చును… ఆయన రాజ్యము అంతములేనిదై యుండును (లూకా 1:32–33)."],
 ["ప్రవక్తల వాక్యము","పూర్వకాలమందు నానాసమయములలో నానావిధములుగా అనేకుల ద్వారా దేవుడు మాటలాడెను; తరచు వారు తిరస్కరింపబడిరి.","ఈ దినముల అంతమందు కుమారుని ద్వారా మనతో మాటలాడెను (హెబ్రీ. 1:1–2). ఆయనే వాక్యము (యోహా. 1:14)."],
 ["యాజకత్వము","మరణము కారణముగా నిలిచియుండలేకపోయినందున అనేకులు యాజకులైరి (హెబ్రీ. 7:23).","మార్పులేని యాజకత్వము గల ఒక్క యాజకుడు; విజ్ఞాపనము చేయుటకు నిరంతరము జీవించుచున్నాడు (హెబ్రీ. 7:24–25)."],
 ["బలి","పాపములను ఎన్నటికిని తీసివేయలేని అనుదిన, వార్షిక బలులు (హెబ్రీ. 10:11).","పాపముల నిమిత్తము సదాకాలము నిలుచు ఏకబలి (హెబ్రీ. 10:12)."],
 ["ఆలయము","సొలొమోను మందిరము 586లో కాల్చబడెను; రెండవ మందిరము అల్పమైనది (హగ్గ. 2:3).","ఆయన శరీరమను దేవాలయము (యోహా. 2:21); విశ్వాసులు ప్రభువునందు పరిశుద్ధ దేవాలయముగా కట్టబడుచున్నారు (ఎఫె. 2:21)."],
 ["నిబంధన","రాతిపలకలమీద వ్రాయబడెను; వారు ఆ నిబంధనను భంగము చేసిరి (యిర్మీ. 31:32).","హృదయములమీద వ్రాయబడెను; పాపములు ఇక జ్ఞాపకము చేసికొనబడవు (యిర్మీ. 31:33–34; హెబ్రీ. 8:10–12)."],
 ["యెరూషలేము","ముట్టడివేయబడి కాల్చబడిన భూలోక పట్టణము.","పైనున్న యెరూషలేము స్వతంత్రురాలు (గల. 4:26); పరలోకపు యెరూషలేము (హెబ్రీ. 12:22)."],
 ["విశ్రాంతి, దేశము","యెహోషువ కనానులో విశ్రాంతి ఇచ్చెను, గాని అది నిలువలేదు (హెబ్రీ. 4:8).","కాబట్టి దేవుని ప్రజలకు విశ్రాంతి నిలిచియున్నది (హెబ్రీ. 4:9)."],
 ["అభిషేకము","ప్రవక్తలు, యాజకులు, రాజులమీద తైలము పోయబడెను (1 రాజు. 19:16; నిర్గమ. 29:7; 1 సమూ. 16:13).","యేసే క్రీస్తు, అనగా అభిషిక్తుడు; దేవుడు ఆయనను పరిశుద్ధాత్మతోను శక్తితోను అభిషేకించెను (అపొ. 10:38)."]
];
TE.types={
 adam:["ఆదాము, కడపటి ఆదాము","మానవజాతికి శిరస్సు; అతని ఒక్క అవిధేయతవలన పాపమును మరణమును అందరికి వచ్చెను.","కడపటి ఆదాము; ఆయన ఒక్క విధేయతవలన నీతియు జీవమును కలుగును; జీవింపజేయు ఆత్మ.","ఎక్కువగా వ్యత్యాసముచేత సాదృశ్యము: ఆదాము చేసినదానిని క్రీస్తు సరిచేయును."],
 passover:["పస్కా గొఱ్ఱెపిల్ల","నిర్దోషమైన గొఱ్ఱెపిల్ల; ద్వారబంధములమీది దాని రక్తము ఐగుప్తులో ఆ రాత్రి తొలిచూలులను కాపాడెను.","మన పస్కాపశువైన క్రీస్తు వధింపబడెను. ఆయన యెముకలలో ఒక్కటియైనను విరువబడలేదు (నిర్గమ. 12:46; యోహా. 19:36).","ప్రతి సంవత్సరపు భోజనము, ఐగుప్తు సందర్భము, ఇంటి వివరములు అన్వయింపబడవు."],
 serpent:["ఇత్తడి సర్పము","పాము కరచిన ఇశ్రాయేలీయులు స్తంభముమీది ఇత్తడి సర్పమును చూచి బ్రదికిరి.","విశ్వసించు ప్రతివాడును నిత్యజీవము పొందునట్లు మనుష్యకుమారుడు ఎత్తబడవలెను.","ఆ వస్తువునకు స్వశక్తి లేదు. ఇశ్రాయేలు దానిని పూజించినప్పుడు హిజ్కియా దానిని విరుగగొట్టెను."],
 melchizedek:["మెల్కీసెదెకు","షాలేము రాజు, సర్వోన్నతుడగు దేవుని యాజకుడు; లేవి గోత్రమువాడు కాడు.","నిరంతర యాజకుడు; నీతికి రాజు, సమాధానమునకు రాజు; నాశనములేని జీవముచేత.","‘తండ్రి లేనివాడు, తల్లి లేనివాడు’ అనునది లేఖనపు మౌనమును సూచించును, అలౌకిక జన్మను కాదు."],
 manna:["మన్నా","అరణ్యములో శరీరములను పోషించి ఉదయమునకు చెడిపోయిన పరలోకపు అనుదిన ఆహారము.","జీవాహారము నేనే. దానిని తినువాడు నిరంతరము జీవించును.","మీ పితరులు అరణ్యములో మన్నాను తినినను చనిపోయిరి (యోహా. 6:49)."],
 rock:["కొట్టబడిన బండ","మోషే కొట్టిన బండనుండి అరణ్యములో నీళ్లు ప్రవహించెను.","ఆ బండ క్రీస్తే. జీవజలము, అనగా ఆత్మ.","మోషే రెండవసారి కొట్టినందున అతనిమీదికి తీర్పు వచ్చెను; ప్రతి వివరమునకు అర్థము ఇయ్యబడలేదు."],
 sabbath:["విశ్రాంతిదినము","వారమునకొకసారి పనినుండి విశ్రాంతి; యెహోషువ క్రింద దేశములో విశ్రాంతి.","కాబట్టి దేవుని ప్రజలకు విశ్రాంతి నిలిచియున్నది. నిజస్వరూపము క్రీస్తులో ఉన్నది.","ప్రభువు దినమునకు విశ్రాంతిదినము ఎట్లు అన్వయించునను విషయములో సంఘములు భిన్నముగా ఉన్నవి."],
 ark:["నోవహు ఓడ","ఓడలో ఎనిమిది మంది నీటిద్వారా రక్షింపబడిరి.","యేసుక్రీస్తు పునరుత్థానము ద్వారా రక్షణ; బాప్తిస్మము దానికి సాదృశ్యము.","అది శరీర మాలిన్యమును తీసివేయుట కాదు అని పేతురు చెప్పుచున్నాడు."],
 isaac:["అర్పింపబడిన ఇస్సాకు","అబ్రాహాము తన ఏకైక కుమారుని మోరీయాలో అర్పించి, ఉపమానరూపముగా అతనిని తిరిగి పొందెను.","దేవుడు తన సొంత కుమారుని అనుగ్రహించుటకు వెనుకతీయలేదు; ఆయన నిజముగా చనిపోయి లేచెను.","ఇస్సాకు కాపాడబడెను, అతనికి బదులుగా పొట్టేలు చనిపోయెను. క్రీస్తు కాపాడబడలేదు."],
 tabernacle:["ప్రత్యక్షపు గుడారము","మోషేకు చూపబడిన మాదిరిచొప్పున చేయబడి, ఇశ్రాయేలు మధ్య దేవుడు నివసించిన గుడారము.","వాక్యము శరీరధారియై మన మధ్య నివసించెను; హస్తకృతము కాని మరి శ్రేష్ఠమును పరిపూర్ణమునైన గుడారము.","పలకలు, దిమ్మలు, తెరలకు క్రొత్త నిబంధన అర్థములు ఇయ్యలేదు."],
 highpriest:["ప్రధానయాజకుడు","అహరోను వంశము; తనకొరకును జనులకొరకును రక్తముతో సంవత్సరమునకొకసారి అతిపరిశుద్ధస్థలములో ప్రవేశించెను.","ఆకాశమండలముగుండ వెళ్లిన గొప్ప ప్రధానయాజకుడు; పాపము లేనివాడు; విజ్ఞాపనము చేయుటకు నిరంతరము జీవించుచున్నాడు.","క్రీస్తునకు తనకొరకు అర్పణ అవసరము లేదు; ఆయన యాజకత్వము లేవి వంశమువలన కాదు."],
 veil:["తెర","అతిపరిశుద్ధస్థలపు మార్గమును అడ్డగించిన తెర.","తెర, అనగా ఆయన శరీరముద్వారా క్రొత్తదియు జీవముగలదియునైన మార్గము; ఆయన మరణమప్పుడు అది చినిగెను.","హెబ్రీయులకు వ్రాసిన పత్రిక ఈ ఒక్క సంబంధమునే చూపును; తెర రంగులు, కెరూబులు వివరింపబడలేదు."],
 atonement:["ప్రాయశ్చిత్తదినము","సంవత్సరమునకొకసారి జనముయొక్క పాపముల నిమిత్తము రక్తము తెరలోపలికి తేబడెను.","క్రీస్తు తన స్వరక్తముతో ఒక్కసారే ప్రవేశించి నిత్యమైన విమోచన సంపాదించెను; గవిని వెలుపల శ్రమపొందెను.","అజాజేలు మేకను క్రొత్త నిబంధన స్పష్టముగా పేర్కొనదు; హెబ్రీ. 13 పాళెము వెలుపల కాల్చబడిన అర్పణను వాడుచున్నది."],
 temple:["దేవాలయము","యెరూషలేములో దేవుని నామము కొరకు సొలొమోను కట్టిన మందిరము; క్రీ.పూ. 586లో కాల్చబడెను.","ఆయన తన శరీరమను దేవాలయమునుగూర్చి ఈ మాట చెప్పెను. దేవాలయముకంటె గొప్పవాడు.","ఆయనమీద కట్టబడిన సంఘమునకును అన్వయించును; రాళ్లు, కొలతలకు అర్థములు ఇయ్యబడలేదు."],
 jonah:["యోనా","మత్స్యము కడుపులో మూడు దినములు మూడు రాత్రులు; తరువాత అతని ప్రకటనవలన నీనెవె మారుమనస్సు పొందెను.","భూగర్భములో మూడు దినములు, తరువాత పునరుత్థానము. యోనాకంటె గొప్పవాడు ఇక్కడ ఉన్నాడు.","యోనా దేవునినుండి పారిపోయి కనికరమునకు కోపపడెను; క్రీస్తు ఇష్టపూర్వకముగా వచ్చెను."],
 moses:["మోషేవంటి ప్రవక్త","ధర్మశాస్త్రమునకు మధ్యవర్తియైన మోషే దేవునితో ముఖాముఖిగా మాటలాడెను.","యేసే వాగ్దానము చేయబడిన ప్రవక్త; దాసునివలె కాక కుమారునివలె నమ్మకముగా ఉన్నాడు.","మోషే పాపి, దేశములోనికి వెళ్లకుండ ఆపబడెను; క్రీస్తు మహిమలో అధికుడు (హెబ్రీ. 3:3)."],
 ladder:["యాకోబు నిచ్చెన","బేతేలులో భూమికి ఆకాశమునకు మధ్య నిచ్చెన; దేవదూతలు ఎక్కుచు దిగుచుండిరి.","దేవదూతలు మనుష్యకుమారునిపైగా ఎక్కుటయు దిగుటయు: ఆకాశమును భూమియు ఆయనయందు కలియును.","యేసు ఈ దృశ్యమును తనకు అన్వయించుకొనెను గాని నిచ్చెన వివరములను విశదపరచలేదు."],
 cornerstone:["విసర్జింపబడిన మూలరాయి","ఇల్లు కట్టువారు నిషేధించిన రాయి మూలకు తలరాయి ఆయెను.","ఇశ్రాయేలు నాయకులు క్రీస్తును విసర్జించిరి; దేవుడు ఆయనను తన ఇంటికి పునాదిగా చేసెను.","కీర్తన 118 మొదట విడిపింపబడిన రాజునుగూర్చియు జనమునుగూర్చియు చెప్పును; దాని పరిపూర్ణత క్రీస్తులో ఉన్నది."],
 bridegroom:["పెండ్లికుమారుడు, పెండ్లికుమార్తె","వివాహము; భర్తవలె ఇశ్రాయేలుపట్ల దేవుని నిబంధన ప్రేమ.","ఈ మర్మము గొప్పది; అయితే నేను క్రీస్తునుగూర్చియు సంఘమునుగూర్చియు చెప్పుచున్నాను.","ఆదాము ప్రక్కనుండి హవ్వ రూపింపబడుట క్రీస్తు పొడువబడిన ప్రక్కనుండి సంఘము పుట్టుటకు చిత్రమనునది సంఘ సంప్రదాయము, క్రొత్త నిబంధన చెప్పినది కాదు."],
 solomon:["సొలొమోనుకంటె గొప్పవాడు","షేబ దేశపు రాణిని ఆకర్షించిన జ్ఞానియైన రాజు.","సొలొమోనుకంటె గొప్పవాడు ఇక్కడ ఉన్నాడు; దేవుని జ్ఞానము వ్యక్తిరూపముగా.","సొలొమోను విగ్రహారాధనయు అనేక భార్యలును ఈ సాదృశ్యములో భాగము కావు."],
 david:["కాపరియైన రాజు దావీదు","గొల్యాతును జయించి రాజైన గొఱ్ఱెల కాపరి బాలుడు.","తన ప్రాణము పెట్టు మంచి కాపరి; దావీదు కుమారుడు, దావీదు ప్రభువు.","దావీదు పాపములు, అతని ఇంటి కలతలు ఈ సాదృశ్యములో భాగము కావు."],
 covenantblood:["నిబంధన రక్తము","మోషే రక్తమును జనులమీద ప్రోక్షించి — ఇదిగో నిబంధన రక్తము అనెను.","ఇది పాపక్షమాపణ నిమిత్తము అనేకుల కొరకు చిందింపబడుచున్న నిబంధన సంబంధమైన నా రక్తము.","పాత నిబంధన రాతిమీద వ్రాయబడి భంగము చేయబడెను; క్రొత్తది హృదయముమీద వ్రాయబడెను."],
 mercyseat:["కరుణాపీఠము","మందసముమీది బంగారు మూత; ప్రాయశ్చిత్తదినమున దానిమీద రక్తము ప్రోక్షింపబడెను.","దేవుడు క్రీస్తును కరుణాధారముగా బయలుపరచెను (గ్రీకు పాత నిబంధనలో కరుణాపీఠమునకు వాడిన పదమే).","రోమా. 3:25 ‘కరుణాపీఠము’ అనా, విస్తృతముగా ‘కరుణాధారము’ అనా అను విషయము వాదనలో ఉన్నది."],
 sacrifices:["బలుల అంతము","పాపములను ఎన్నటికిని తీసివేయలేని అనుదిన, వార్షిక అర్పణలు.","ఒక్క అర్పణచేత పరిశుద్ధపరచబడువారిని సదాకాలమునకు సంపూర్ణులుగా చేసెను.","ప్రతి అర్పణలోని ప్రతి భాగమును క్రీస్తునకు జతపరచుట ఊహాకల్పన. ‘నాకు శరీరమును అమర్చితివి’ అనునది గ్రీకు పాత నిబంధనను అనుసరించును."],
 israelson:["దేవుని కుమారుడైన ఇశ్రాయేలు","ఐగుప్తులోనుండి పిలువబడి, సముద్రముగుండ దాటి, నలువది సంవత్సరములు అరణ్యములో శోధింపబడి, విఫలమాయెను.","యేసు ఐగుప్తులోనుండి పిలువబడి, బాప్తిస్మము పొంది, నలువది దినములు శోధింపబడి, ద్వితీయోపదేశకాండమునుండి జవాబిచ్చెను: విధేయుడైన కుమారుడు.","హోషే. 11:1 ఇశ్రాయేలునుగూర్చిన చరిత్ర; మత్తయి దానిని క్రీస్తునందు నెరవేరిన మాదిరిగా చదువుచున్నాడు."]
};

TE.seedside="<b>రెండు వంశావళులు, ఒక్కడే క్రీస్తు.</b> మత్తయి అబ్రాహామునుండి ఆరంభించి సొలొమోను, రాజుల ద్వారా వెళ్లును (మత్త. 1:1–17) — ఇశ్రాయేలునకు న్యాయమైన రాజును చూపుచున్నాడు. లూకా నాతాను ద్వారా వెనుకకు దేవుని కుమారుడైన ఆదాము వరకు వెళ్లును (లూకా 3:23–38) — సమస్త మానవజాతికి మనుష్యకుమారుని చూపుచున్నాడు. దావీదుకును యోసేపుకును మధ్య ఇవి ఎందుకు భిన్నముగా ఉన్నవనునది చిరకాల ప్రశ్న: లూకా మరియ వంశమును ఇచ్చుచున్నాడని అనేకులు, ఒకటి చట్టబద్ధ వంశము మరియొకటి సహజ వంశమని మరికొందరు భావించుదురు.";

TE.views3=[
 ["జాతీయ ఇశ్రాయేలునకు ప్రత్యేక భవిష్యత్తు","డిస్పెన్సేషనల్ వెయ్యేండ్ల-పూర్వవాదము","దేవుని ప్రణాళికలో ఇశ్రాయేలు, సంఘము రెండు వేర్వేరు ప్రజలు. ‘ఇశ్రాయేలీయులందరు’ (రోమా. 11:26) అనగా ఆయన రాకడలో క్రీస్తువైపు తిరుగు యూదు జనము. దేశము, సింహాసనమునుగూర్చిన వాగ్దానములు రాబోవు వెయ్యేండ్ల పరిపాలనలో జాతీయ ఇశ్రాయేలునకు అక్షరశః నెరవేరును."],
 ["యూదులు ఒక్క సంఘములోనికి భవిష్యత్తులో తిరుగుట","చారిత్రిక వెయ్యేండ్ల-పూర్వవాదము, అనేక రిఫార్మ్డ్/ప్యూరిటన్ రచయితలు","దేవుని ప్రజలు ఒక్కరే, ఒక్క ఒలీవ వృక్షము. అయినను ‘ఇశ్రాయేలీయులందరు’ అనునది భవిష్యత్తులో యూదులు పెద్ద సంఖ్యలో క్రీస్తువైపు తిరిగి అదే వృక్షములో మరల అంటుకట్టబడుటను సూచించును; వేరొక ప్రణాళిక కాదు."],
 ["క్రీస్తునందు ఒక్కటే ప్రజ; వాగ్దానములు ఆయనలో నెరవేరెను","వెయ్యేండ్ల-రహితవాదము, నిబంధన వేదాంతము","‘ఇశ్రాయేలీయులందరు’ అనగా దేవుడు ఏర్పరచుకొనినవారి పూర్ణసంఖ్య: చరిత్ర పొడుగున రక్షింపబడు ఏర్పరచబడిన యూదులందరు, లేక యూదులును అన్యజనులునుగల సంఘమంతయు (గల. 6:16 పోల్చుము). దేశము, మందిరము, సింహాసనమునుగూర్చిన వాగ్దానములు క్రీస్తునందును నూతన సృష్టియందును నెరవేరును."]
];
TE.common="<b>అందరు అంగీకరించునది:</b> యూదులకును అన్యజనులకును రక్షణ క్రీస్తునందు మాత్రమే (అపొ. 4:12; రోమా. 10:12–13). దేవుడు తన ప్రజలను విసర్జింపలేదు (రోమా. 11:1–2). అన్యజనులు ఒక్క ఒలీవ వృక్షములో అంటుకట్టబడిరి (రోమా. 11:17–24). దేవుడు తన కృపావరముల విషయములోను పిలుపు విషయములోను పశ్చాత్తాపపడడు (రోమా. 11:29).";
TE.rings=[
 "ఇప్పుడు మూలుగుచున్న సృష్టి దాని దాస్యమునుండి విడిపింపబడును. ఇదిగో సమస్తమును నూతనమైనవిగా చేయుచున్నాను.",
 "సమస్తమును ఆయనద్వారాను ఆయననుబట్టియు సృజింపబడెను; ఆయనద్వారా దేవుడు సమస్తమును తనతో సమాధానపరచుకొనెను. ప్రతి మోకాలును వంగును.",
 "ప్రతి జనములోనుండి, ప్రతి భాషలోనుండి లెక్కింప శక్యముకాని గొప్ప సమూహము — సింహాసనాసీనుడైన మా దేవునికిని గొఱ్ఱెపిల్లకును రక్షణ అని కేకలు వేయుచున్నది.",
 "మధ్యగోడ పడగొట్టబడెను; అదే శరీరములో తోటి వారసులు.",
 "సమస్తమును సమస్తములో నింపుచున్న వాని సంపూర్ణత; కళంకమైనను ముడతయైనను లేని మహిమగల సంఘము.",
 "అన్నిటిలో ఆయన ప్రాముఖ్యము కలిగియుండునట్లు."
];
TE.intro={
 offices:"ఇశ్రాయేలు మూడు అభిషిక్త పదవులను వేరుగా ఉంచెను. ప్రవక్త దేవుని పక్షమున జనులతో మాటలాడెను; యాజకుడు జనుల పక్షమున దేవునియొద్దకు వెళ్లెను; రాజు దేవుని క్రింద జనులను ఏలెను. యాజకుని పనిలో చేయిపెట్టిన రాజులు తీర్పుపొందిరి. దేవుని అంగీకారముతో పదవులను కలిపినవారుగా లేఖనము ఇద్దరినే చూపుచున్నది: మెల్కీసెదెకు, వాగ్దానము చేయబడిన చిగురు. క్రొత్త నిబంధన ఈ మూడును క్రీస్తునందు ఏకమైనట్లు చూపుచున్నది.",
 timeline:"సమూయేలు నుండి మలాకీ వరకు రాజులు, ప్రవక్తలు, యాజకులు ఒకే కాలరేఖపై; పైన భూలోక సంఘటనలు, క్రింద నిత్య వాగ్దానములు. భూలోక సింహాసనము ఇరుకై పడిపోవుచుండగా, విఫలము కాని రాజును యాజకుని ప్రవక్తను గూర్చిన వాగ్దానములు మరింత స్పష్టమగుచున్నవి. బంగారు చుక్క క్రొత్త నిబంధన స్వయముగా క్రీస్తునకు సాదృశ్యమని పేర్కొనిన వ్యక్తిని సూచించును.",
 types:"ప్రతి సాదృశ్యము ఆ సంబంధమును స్వయముగా చూపు క్రొత్త నిబంధన వచనముతో ఆరంభమగును. భూలోక పార్శ్వము ఛాయ: ఇశ్రాయేలు చరిత్రలోని వ్యక్తి, సంఘటన లేక వస్తువు. నిత్య పార్శ్వము క్రీస్తునందలి నిజస్వరూపము. చివరి వాక్యము పోలిక ఎక్కడ ఆగవలెనో చెప్పును, ఆ సాదృశ్యమును లేఖనము చెప్పినదానికంటె మించి లాగకుండునట్లు.",
 contrast:"భూలోక రాజ్యమును నిత్య రాజ్యమును విషయమువారీగా ప్రక్కప్రక్కన.",

const T0=1110,T1=400;let SC=2.1;

const ROWLAB={events:["Temporal events","భూలోక సంఘటనలు"],uni:["United kingdom","ఐక్య రాజ్యము"],isr:["Israel","ఇశ్రాయేలు"],jud:["Judah","యూదా"],pro:["Prophets","ప్రవక్తలు"],pri:["Priests","యాజకులు"],prom:["Eternal promises","నిత్య వాగ్దానములు"]};

  {k:"uni",cls:"earthrow",items:KINGS.filter(k=>k[4]==="uni").map(k=>({id:k[0],label:kn(k),y1:k[2],y2:k[3],col:"var(--uni)",kind:"king"}))},

  {k:"jud",cls:"earthrow",items:KINGS.filter(k=>k[4]==="jud").map(k=>({id:k[0],label:kn(k),y1:k[2],y2:k[3],col:"var(--jud)",kind:"king"}))},
  {k:"pro",cls:"",items:PROPHETS.map(p=>({id:p[0],label:P(p[1],(TE.prophets[p[0]]||[])[0]),y1:p[2],y2:p[3],col:"var(--pro)",kind:"prophet"}))},
  {k:"pri",cls:"",items:PRIESTS.map(p=>({id:p[0],label:P(p[1],(TE.priests[p[0]]||[])[0]),y1:p[2],y2:p[3],col:"var(--pri)",kind:"priest"}))},
  {k:"prom",cls:"eternalrow",pt:true,items:PROMISES.map((p,i)=>({id:"pr"+i,label:P(p.t,TE.prom[i][0]),y1:p.y,y2:p.y,col:"var(--eter)",kind:"promise"}))}
 ];
 let h=`<div class="axis" style="width:${W}px">`;for(let y=1100;y>=400;y-=50)h+=`<span style="left:${xOf(y)}px">${y}</span>`;h+=`</div>`;
 for(let y=1100;y>=400;y-=50)h+=`<div class="gl" style="left:${xOf(y)}px"></div>`;
 rows.forEach(r=>{const n=pack(r.items,r.pt),hh=n*25+10;
  h+=`<div class="trow ${r.cls}" style="height:${hh}px;width:${W}px"><div class="lab">${esc(P(...ROWLAB[r.k]))}</div>`;
  r.items.forEach(it=>{const top=6+it._lane*25,star=(OFFMAP[it.id]&&OFFMAP[it.id].types)?'<span class="star"></span>':"";
   if(r.pt)h+=`<div class="it pt" data-k="${it.kind}" data-id="${it.id}" style="left:${it._x}px;top:${top}px"><span class="dot" style="background:${it.col}"></span><span class="tx">${esc(it.label)}</span></div>`;
   else{const out=it._bw<it._tw;h+=`<div class="it ${out?"out":""}" data-k="${it.kind}" data-id="${it.id}" style="left:${it._x}px;top:${top}px;width:${out?it._bw+it._tw:it._bw}px" title="${esc(it.label)} · ${yr(it.y1,it.y2)}">${star}<span class="bar" style="width:${it._bw}px;background:${it.col}"></span><span class="tx" ${out?`style="padding-left:${it._bw+3}px"`:""}>${esc(it.label)}</span></div>`}
  });h+=`</div>`});
 h+=`<div class="endcap" style="left:${xOf(445)}px;width:${xOf(T1)+60-xOf(445)}px">${LANG==="te"?"400 మౌన సంవత్సరములు<br>→ క్రీస్తు: ప్రవక్త,<br>యాజకుడు, రాజు":"400 silent years<br>→ Christ: Prophet,<br>Priest &amp; King"}</div>`;

 const N=LINES.length,gap=44,top=92,W=1190,H=top+(N-1)*gap+50,hubX=560,hubY=top+(N-1)*gap/2,endX=1125,X1=205,X2=360,XC=760,XF=950;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:980px;width:100%;height:auto">`;
 const bands=[[150,470,"#f1e8dc","Shadow","ఛాయ","Old Testament","పాత నిబంధన","is-earthly"],[470,650,"#efe2c3","Substance","నిజస్వరూపము","Christ","క్రీస్తు","is-eternal"],[650,860,"#e5f0ea","Expression","వ్యక్తీకరణ","The Church","సంఘము","is-eternal"],[860,1190,"#fbf3dc","Fullness","సంపూర్ణత","The final gathering","అంతిమ సమకూర్పు","is-eternal"]];
 bands.forEach(b=>{const cx=(b[0]+b[1])/2;s+=`<g class="${b[7]}"><rect x="${b[0]}" y="0" width="${b[1]-b[0]}" height="${H}" fill="${b[2]}" opacity=".55"/>`;
  if(LANG==="te")s+=`<text x="${cx}" y="28" text-anchor="middle" font-family="Noto Sans Telugu" font-size="16" font-weight="700" fill="#2a2118">${b[4]}</text><text x="${cx}" y="50" text-anchor="middle" font-family="Noto Sans Telugu" font-size="11.5" fill="#6e604f">${b[6]}</text>`;
  else s+=`<text x="${cx}" y="24" text-anchor="middle" font-family="Cormorant Garamond,Noto Sans Telugu,serif" font-size="19" font-weight="700" fill="#2a2118">${b[3]}</text>${LANG==="both"?`<text x="${cx}" y="42" text-anchor="middle" font-family="Noto Sans Telugu" font-size="12" fill="#6e604f">${b[4]}</text>`:""}<text x="${cx}" y="${LANG==="both"?58:44}" text-anchor="middle" font-size="11" fill="#6e604f">${b[5]}</text>`;
  s+=`</g>`});
 LINES.forEach((L,i)=>{const y=top+i*gap,t=TE.lines[L.id];
  const a=`M150,${y} L${X2},${y} C${X2+110},${y} ${hubX-90},${hubY} ${hubX},${hubY}`;
  const b=`M${hubX},${hubY} C${hubX+90},${hubY} ${XC-110},${y} ${XC},${y} L${XF},${y} C${XF+100},${y} ${endX-90},${hubY} ${endX},${hubY}`;
  s+=`<g class="ln ${metroSel===L.id?"on":""}" data-l="${L.id}">`;
  if(LANG==="both")s+=`<text x="10" y="${y-3}" font-size="12.5" font-weight="700" fill="${L.c}">${L.en}</text><text x="10" y="${y+13}" font-family="Noto Sans Telugu" font-size="11" fill="#6e604f">${L.te}</text>`;
  else s+=`<text x="10" y="${y+4}" font-size="${LANG==="te"?12:12.5}" font-weight="700" fill="${L.c}" font-family="Inter,Noto Sans Telugu">${esc(P(L.en,L.te))}</text>`;
  s+=`<path class="is-earthly" d="${a}" fill="none" stroke="${L.c}" stroke-width="5" stroke-linecap="round"/><path class="is-eternal" d="${b}" fill="none" stroke="${L.c}" stroke-width="5" stroke-linecap="round"/>`;
  const st=(x,lab,labte,ref,cls)=>`<g class="${cls}"><circle cx="${x}" cy="${y}" r="6" fill="#fffcf6" stroke="${L.c}" stroke-width="3"><title>${esc(P(lab,labte))} · ${esc(RF(ref))}</title></circle><text x="${x}" y="${y-10}" text-anchor="middle" font-size="${LANG==="te"?9.5:10.5}" fill="#2a2118" font-family="Inter,Noto Sans Telugu">${esc(P(lab,labte))}</text></g>`;
  s+=st(X1,L.ot[0][0],t[0][0],L.ot[0][1],"is-earthly")+st(X2,L.ot[1][0],t[0][1],L.ot[1][1],"is-earthly")+st(XC,L.church[0],t[2],L.church[1],"is-eternal")+st(XF,L.full[0],t[3],L.full[1],"is-eternal")+`</g>`;
 });
 const hubT=LANG==="te"?`<text x="${hubX}" y="${hubY+5}" text-anchor="middle" font-family="Noto Sans Telugu" font-size="16" font-weight="700" fill="#f1d98a">క్రీస్తు</text>`:`<text x="${hubX}" y="${hubY-6}" text-anchor="middle" font-family="Cormorant Garamond,Noto Sans Telugu,serif" font-size="22" font-weight="700" fill="#f1d98a">Christ</text>${LANG==="both"?`<text x="${hubX}" y="${hubY+13}" text-anchor="middle" font-family="Noto Sans Telugu" font-size="12" fill="#fbf3dc">క్రీస్తు</text>`:""}<text x="${hubX}" y="${hubY+28}" text-anchor="middle" font-size="9" fill="#d9ccb0">crucified · risen</text>`;
 s+=`<g data-hub="1" style="cursor:pointer"><circle cx="${hubX}" cy="${hubY}" r="46" fill="#2a2118" stroke="#f1c94a" stroke-width="4"/>${hubT}</g>`;
 const endT=LANG==="te"?`<text x="${endX}" y="${hubY-4}" text-anchor="middle" font-family="Noto Sans Telugu" font-size="12" font-weight="700" fill="#fff">సమస్తము</text><text x="${endX}" y="${hubY+14}" text-anchor="middle" font-family="Noto Sans Telugu" font-size="12" font-weight="700" fill="#fff">క్రీస్తునందు</text><text x="${endX}" y="${hubY+32}" text-anchor="middle" font-size="9.5" fill="#fbf3dc">ఎఫె. 1:10</text>`:`<text x="${endX}" y="${hubY-10}" text-anchor="middle" font-family="Cormorant Garamond,Noto Sans Telugu,serif" font-size="16" font-weight="700" fill="#fff">All things</text><text x="${endX}" y="${hubY+6}" text-anchor="middle" font-family="Cormorant Garamond,Noto Sans Telugu,serif" font-size="16" font-weight="700" fill="#fff">in Christ</text>${LANG==="both"?`<text x="${endX}" y="${hubY+22}" text-anchor="middle" font-family="Noto Sans Telugu" font-size="9.5" fill="#fff">సమస్తము క్రీస్తునందు</text>`:""}<text x="${endX}" y="${hubY+36}" text-anchor="middle" font-size="9.5" fill="#fbf3dc">Eph 1:10</text>`;
 s+=`<g data-end="1" style="cursor:pointer" class="is-eternal"><circle cx="${endX}" cy="${hubY}" r="52" fill="#9a7414" stroke="#f1c94a" stroke-width="4"/>${endT}</g></svg>`;
 const m=$("#metroBox");m.innerHTML=s;m.classList.toggle("sel",!!metroSel);
 m.querySelectorAll(".ln").forEach(g=>g.onclick=()=>pickLine(g.dataset.l,true));
 m.querySelector("[data-hub]").onclick=()=>openChrist("all");
 m.querySelector("[data-end]").onclick=()=>openRing(0);
 $("#metrochips").innerHTML=`<button data-l="" class="${metroSel?"":"on"}">${esc(P("All lines","అన్ని మార్గములు"))}</button>`+LINES.map(L=>`<button data-l="${L.id}" class="${metroSel===L.id?"on":""}"><i style="background:${L.c}"></i>${Ti(L.en,L.te)}</button>`).join("");
 $("#metrochips").querySelectorAll("button").forEach(b=>b.onclick=()=>pickLine(b.dataset.l,!!b.dataset.l));
}
function pickLine(id,open){metroSel=id||null;renderMetro();if(open&&id)openLine(id)}
function openLine(id){
 const L=LINES.find(x=>x.id===id),t=TE.lines[id];
 const row=(k,cls,lab,labte,ref)=>`<div class="${cls}" style="border-radius:10px;padding:8px 10px;margin-bottom:6px"><span class="k">${uT(k)}</span><b>${T(lab,labte)}</b><span class="r" style="display:block;font-size:12px;opacity:.8">${esc(RF(ref))}</span></div>`;
 show(`<div class="k" style="color:${L.c}">${uT("line")}</div><h2>${Ti(L.en,L.te)}</h2>`,`<div class="chain" style="grid-template-columns:1fr">`+row("shadow","c1",L.ot[0][0],t[0][0],L.ot[0][1])+row("shadow","c1",L.ot[1][0],t[0][1],L.ot[1][1])+row("inChrist","c2",L.christ[0],t[1],L.christ[1])+row("inChurch","c3",L.church[0],t[2],L.church[1])+row("fullness","c4",L.full[0],t[3],L.full[1])+`</div>`);
}

/* ================= SEED ================= */
function renderSeed(){
 const W=980,cx=490,top=40,step=46,nT=SEED.length,waist=top+nT*step+30,nB=SPREAD.length,H=waist+40+nB*step+30;
 const lab=(n,te)=>LANG==="en"?`${esc(n)}`:LANG==="te"?`<tspan font-family="Noto Sans Telugu" font-size="14">${esc(te)}</tspan>`:`${esc(n)} <tspan font-family="Noto Sans Telugu" font-size="11" font-weight="400" fill="#6e604f">${esc(te)}</tspan>`;
 const est=p=>(LANG==="te"?tw(p.te,14,700):tw(p.n,16,700)+(LANG==="both"?tw(p.te,11,400)+6:0))+46;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:760px;width:100%;height:auto"><defs><linearGradient id="hgT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e8dc"/><stop offset="1" stop-color="#e6d6bd"/></linearGradient><linearGradient id="hgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7b8"/><stop offset="1" stop-color="#fbf3dc"/></linearGradient></defs>`;
 s+=`<polygon class="is-earthly" points="${cx-430},${top-20} ${cx+430},${top-20} ${cx+40},${waist-34} ${cx-40},${waist-34}" fill="url(#hgT)"/><polygon class="is-eternal" points="${cx-40},${waist+34} ${cx+40},${waist+34} ${cx+430},${H-10} ${cx-430},${H-10}" fill="url(#hgB)"/>`;
 s+=`<text x="16" y="${top-2}" font-size="11" font-weight="700" letter-spacing="1" fill="#8a6f57" class="is-earthly">${esc(P("NARROWING","ఇరుకగుట"))}</text><text x="${W-16}" y="${top-2}" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1" fill="#8a6f57" class="is-earthly">${esc(P("SET ASIDE FROM THE LINE","వంశమునుండి ప్రక్కకు"))}</text>`;
 SEED.forEach((p,i)=>{const y=top+20+i*step,w=Math.max(320-i*20,est(p)),t=TE.seed[i];
  s+=`<g class="is-earthly" data-sd="${i}" style="cursor:pointer"><rect x="${cx-w/2}" y="${y-17}" width="${w}" height="34" rx="17" fill="#fffcf6" stroke="#8a6f57"/><text x="${cx}" y="${y-1}" text-anchor="middle" font-family="Cormorant Garamond,Noto Sans Telugu,serif" font-size="17" font-weight="700" fill="#2a2118">${lab(p.n,p.te)}</text><text x="${cx}" y="${y+12}" text-anchor="middle" font-size="9.5" fill="#6e604f">${esc(RF(p.r))}</text>`;
  if(p.aside)s+=`<text x="${W-16}" y="${y+4}" text-anchor="end" font-size="11" fill="#a3322c" opacity=".8" font-family="Inter,Noto Sans Telugu">${esc(P(p.aside,t[1]))}</text>`;
  s+=`</g>`});
 s+=`<g data-hub="1" style="cursor:pointer"><rect x="${cx-160}" y="${waist-30}" width="320" height="60" rx="30" fill="#2a2118" stroke="#f1c94a" stroke-width="3"/><text x="${cx}" y="${waist-6}" text-anchor="middle" font-family="Cormorant Garamond,Noto Sans Telugu,serif" font-size="${LANG==="te"?18:22}" font-weight="700" fill="#f1d98a">${esc(LANG==="en"?"Jesus Christ":LANG==="te"?"యేసుక్రీస్తు":"Jesus Christ · యేసుక్రీస్తు")}</text><text x="${cx}" y="${waist+14}" text-anchor="middle" font-size="11" fill="#fbf3dc" font-family="Inter,Noto Sans Telugu">${esc(P("“thy seed, which is Christ” · Gal 3:16; 4:4","నీ సంతానము, అనగా క్రీస్తు · గల. 3:16; 4:4"))}</text></g>`;
 s+=`<text x="16" y="${waist+60}" font-size="11" font-weight="700" letter-spacing="1" fill="#9a7414" class="is-eternal">${esc(P("WIDENING","విస్తరించుట"))}</text><text x="${W-16}" y="${waist+60}" text-anchor="end" font-size="11" font-weight="700" letter-spacing="1" fill="#2e7a57" class="is-eternal">${esc(P("BROUGHT IN","చేర్చబడినవారు"))}</text>`;
 SPREAD.forEach((p,i)=>{const y=waist+90+i*step,w=Math.max(180+i*28,est(p)),t=TE.spread[i];
  s+=`<g class="is-eternal" data-sp="${i}" style="cursor:pointer"><rect x="${cx-w/2}" y="${y-17}" width="${w}" height="34" rx="17" fill="#fffcf6" stroke="#9a7414"/><text x="${cx}" y="${y-1}" text-anchor="middle" font-family="Cormorant Garamond,Noto Sans Telugu,serif" font-size="16.5" font-weight="700" fill="#2a2118">${lab(p.n,p.te)}</text><text x="${cx}" y="${y+12}" text-anchor="middle" font-size="9.5" fill="#6e604f">${esc(RF(p.r))}</text>`;
  if(p.ins)s+=`<text x="${W-16}" y="${y+4}" text-anchor="end" font-size="11" fill="#2e7a57" font-family="Inter,Noto Sans Telugu">${esc(P(p.ins,t[1]))}</text>`;
  s+=`</g>`});
 s+=`</svg>`;
 $("#seedBox").innerHTML=s;
 $("#seedBox").querySelectorAll("[data-sd]").forEach(g=>g.onclick=()=>{const i=+g.dataset.sd,p=SEED[i],t=TE.seed[i];show(`<div class="k" style="color:var(--earth)">${uT("narrowLine")}</div><h2>${Ti(p.n,p.te)}</h2>`,`<div class="ee" style="grid-template-columns:1fr"><div class="earthly"><span class="k">${esc(RF(p.r))}</span>${T(p.d,t[0])}</div></div>`+(p.aside?`<div class="limit"><b>${u("setAside")}</b> ${T(p.aside,t[1])}</div>`:""))});
 $("#seedBox").querySelectorAll("[data-sp]").forEach(g=>g.onclick=()=>{const i=+g.dataset.sp,p=SPREAD[i],t=TE.spread[i];show(`<div class="k" style="color:var(--eter)">${uT("widen")}</div><h2>${Ti(p.n,p.te)}</h2>`,`<div class="ee" style="grid-template-columns:1fr"><div class="eternal"><span class="k">${esc(RF(p.r))}</span>${T(p.d,t[0])}</div></div>`+(p.ins?`<div class="limit"><b style="color:var(--good)">${u("broughtIn")}</b> ${T(p.ins,t[1])}</div>`:""))});
 $("#seedBox").querySelector("[data-hub]").onclick=()=>openChrist("all");
 const sideEn=`<b>Two genealogies, one Christ.</b> Matthew starts from Abraham and runs through Solomon and the kings (Matt 1:1–17), presenting the rightful King of Israel. Luke runs backward through Nathan to “Adam, which was the son of God” (Luke 3:23–38), presenting the Son of man for all mankind. Why they differ between David and Joseph is a long-standing question: many hold that Luke gives Mary's line, others that one list is legal descent and the other natural.`;
 $("#seedside").innerHTML=LANG==="en"?sideEn:LANG==="te"?`<span class="te">${TE.seedside}</span>`:sideEn+`<span class="tl te" style="margin-top:6px">${TE.seedside}</span>`;
}

function renderRestore(){
 const keys=["b","p","c","a","n"],cls=["c0","c1","c2","c3","c4"],lab=["broken","promised","inChrist","already","notyet"],lens=["is-earthly","is-earthly","is-eternal","is-eternal","is-eternal"];
 let h=REST.map((r,ri)=>{const t=TE.rest[ri];return `<div class="rest"><h3>${Ti(r.en,t[0])}</h3><div class="chain">${keys.map((k,j)=>`<div class="${cls[j]} ${lens[j]}"><span class="k">${uT(lab[j])}</span>${T(r[k][0],t[j+1][0])}<span class="r">${esc(RF(r[k][1]))}</span></div>`).join("")}</div></div>`}).join("");
 const commonEn=`<b>Common ground:</b> salvation is in Christ alone for Jew and Gentile (Acts 4:12; Rom 10:12–13). God “hath not cast away his people” (Rom 11:1–2). Gentiles are grafted into one olive tree (Rom 11:17–24). “The gifts and calling of God are without repentance” (Rom 11:29).`;
 const common=LANG==="en"?commonEn:LANG==="te"?`<span class="te">${TE.common}</span>`:commonEn+`<span class="tl te" style="margin-top:5px">${TE.common}</span>`;
 h+=`<div class="views"><div class="k" style="color:var(--mixed)">${uT("differ")}</div><h3>${Ti(U.israelFuture[0],U.israelFuture[1])}</h3><p class="ref" style="margin:4px 0 0">${T("“And so all Israel shall be saved” (Rom 11:26). Bible-believing Christians read this in three main ways:","‘ఈ విధముగా ఇశ్రాయేలీయులందరును రక్షింపబడుదురు’ (రోమా. 11:26). బైబిలును నమ్ము క్రైస్తవులు దీనిని మూడు ప్రధాన విధములుగా చదువుదురు:")}</p><div class="vgrid">${VIEWS3.map((v,i)=>{const t=TE.views3[i];return `<div><h4>${T(v.h,t[0])}</h4><div class="who">${T(v.who,t[1])}</div>${T(v.t,t[2])}<div class="ref" style="margin-top:5px">${esc(RF(v.k))}</div></div>`}).join("")}</div><div class="common">${common}</div></div>`;
 $("#restlist").innerHTML=h;
}

/* ================= GATHERING ================= */
const STEPS=[["Christ the firstfruits, risen","1 Cor 15:20, 23","క్రీస్తు ప్రథమఫలముగా లేచెను"],["The gospel to all nations; the Church built","Matt 24:14; 16:18","సువార్త సర్వజనములకు; సంఘము కట్టబడుట"],["“Afterward they that are Christ's at his coming”","1 Cor 15:23; 1 Thess 4:16–17","తరువాత ఆయన రాకడయందు క్రీస్తు సంబంధులు"],["He reigns till all enemies are under His feet; death destroyed last","1 Cor 15:25–26","శత్రువులందరు ఆయన పాదముల క్రింద; కడపటి శత్రువైన మరణము నశించును"],["New heaven and new earth; God dwells with men","Rev 21:1–5","క్రొత్త ఆకాశము, క్రొత్త భూమి; దేవుడు మనుష్యులతో నివసించును"],["The Son delivers the kingdom to the Father, “that God may be all in all”","1 Cor 15:24, 28","కుమారుడు రాజ్యమును తండ్రికి అప్పగించును; దేవుడు సర్వములో సర్వమై యుండును"]];
