  <div class="settings" id="settings" hidden>

      <button type="button" data-size="-1" aria-label="Smaller text">A&minus;</button>

    </div>
    <div class="row"><span data-i18n="theme">Theme</span>
      <button type="button" data-theme="light" data-i18n="light">Light</button>
      <button type="button" data-theme="dark" data-i18n="dark">Dark</button>
      <button type="button" data-theme="auto" data-i18n="auto">Auto</button>
    </div>
  </div>
</header>
